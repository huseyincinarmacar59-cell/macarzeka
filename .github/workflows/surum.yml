name: Sürüm yayımla

# v1.4 gibi bir etiket gönderince Windows programını derler ve
# Releases sayfasına yükler. Program bunu görüp kendini günceller.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Sürüm numarasını etiketten al
        run: |
          ETIKET="${GITHUB_REF_NAME#v}"
          echo "Etiket sürümü: $ETIKET"
          sed -i "s/^const surum = \".*\"$/const surum = \"$ETIKET\"/" main.go
          grep -n 'const surum' main.go

      - name: Denetle
        run: go vet ./...

      - name: Windows 64-bit derle
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o MacarZeka.exe .

      - name: Paketi hazırla
        run: |
          mkdir -p paket/MacarZeka
          cp MacarZeka.exe paket/MacarZeka/
          cp OKUBENI.txt paket/MacarZeka/ 2>/dev/null || true
          cp icon.ico    paket/MacarZeka/ 2>/dev/null || true
          cd paket && zip -r -9 ../MacarZeka-Windows-64bit.zip MacarZeka

      - name: Releases sayfasına yükle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MacarZeka.exe
            MacarZeka-Windows-64bit.zip
          generate_release_notes: true
