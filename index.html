<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com">
<title>MacarZeka — Müşteri Takibi</title>

<!-- Telefonda "Ana Ekrana Ekle" dendiğinde uygulama gibi açılsın -->
<meta name="theme-color" content="#13251D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="format-detection" content="telephone=no">

<link rel="icon" href="icon-192.png" sizes="192x192">

<style>
  :root{
    --bg:#F7F5EF; --card:#FFFFFF; --ink:#16211B; --muted:#566159;
    --line:#E6E1D4; --line2:#EDE8DB; --green:#1F5D45; --green-soft:#E7EFE8;
    --green-line:#CFE0D6; --dark:#13251D; --dark2:#214536; --dark-ink:#C9D6CE;
    --dark-mut:#8FA79A; --red:#8A3F12; --red-soft:#F7E6DA; --red-bg:#FDF6F1;
    --red-line:#EBD6C6; --warn:#4A4320; --warn-soft:#F0EBD5; --field:#DDD7C8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--field);border-radius:11px;padding:11px 13px;width:100%;min-height:44px}
  textarea{min-height:84px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .app{display:flex;height:100vh}
  .side{flex:0 0 240px;background:var(--dark);color:var(--dark-ink);padding:22px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .brand .mark{width:36px;height:36px;border-radius:11px;background:#2E7D5B;display:flex;align-items:center;justify-content:center;flex:none}
  .brand b{display:block;color:#fff;font-size:18px;letter-spacing:-.2px}
  .brand span{display:block;font-size:11px;color:var(--dark-mut)}
  .nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;background:none;border:none;color:var(--dark-ink);font-size:15px;min-height:44px;width:100%;text-align:left}
  .nav:hover{background:#1b3a2d;color:#fff}
  .nav.on{background:var(--dark2);color:#fff;font-weight:600}
  .side-foot{margin-top:auto;border-top:1px solid #1E3A2E;padding-top:12px;display:flex;flex-direction:column;gap:7px}
  .kayit-durum{font-size:12px;color:var(--dark-mut);padding:0 8px 4px;line-height:1.5;word-break:break-word}
  .mini{background:#1b3a2d;border:none;color:var(--dark-ink);border-radius:9px;padding:9px 10px;font-size:13px;min-height:38px;text-align:left}
  .mini:hover{background:var(--dark2);color:#fff}
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 40px;overflow-y:auto}
  h1{font-size:27px;letter-spacing:-.4px;margin:0}
  .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:11px;padding:0 18px;min-height:44px;font-size:15px;font-weight:600}
  .btn:hover{background:#174a37}
  .btn2{background:#fff;color:var(--ink);border:1px solid var(--field)}
  .btn2:hover{background:#f1eee4}
  .btn3{background:none;border:none;color:var(--green);font-weight:600;font-size:14px;padding:6px 2px;min-height:auto}
  .btn-dan{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}
  .card .k{font-size:13px;color:var(--muted)}
  .card .v{font-size:27px;margin-top:5px;font-weight:600;letter-spacing:-.5px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2);font-size:16px;font-weight:700}
  .box-p{padding:18px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);background:#FAF8F2;padding:11px 16px;font-weight:600;white-space:nowrap}
  td{padding:13px 16px;border-top:1px solid var(--line2);vertical-align:middle}
  tbody tr:hover{background:#FAF8F2}
  .rowlink{font-weight:600;color:var(--green);background:none;border:none;padding:0;font-size:14px;text-align:left}
  .rowlink:hover{text-decoration:underline}
  .r{text-align:right}
  .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap}
  .t-ok{color:var(--green);background:var(--green-soft)}
  .t-borc{color:var(--red);background:var(--red-soft)}
  .t-vade{color:var(--warn);background:var(--warn-soft)}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .col-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .pill{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--field);background:#fff;font-size:14px;font-weight:600}
  .pill.on{background:var(--green-soft);border:1.5px solid var(--green)}
  .rad{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:0;padding:0 15px;background:#fff;border:1px solid var(--field);border-radius:11px;font-size:14px;font-weight:600;color:var(--ink)}
  .rad.on{background:var(--green-soft);border:1.5px solid var(--green)}
  .rad input{width:17px;height:17px;min-height:0;padding:0;accent-color:var(--green)}
  .ozet{background:var(--green-soft);border:1px solid var(--green-line);border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.6}
  .uyari{background:var(--red-bg);border:1px solid var(--red-line);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55;color:var(--ink)}
  .ava{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
  .sect{font-size:12px;font-weight:700;letter-spacing:1.1px;color:var(--green);margin-bottom:13px}
  .lbl{font-size:12px;font-weight:700;letter-spacing:1.1px;color:var(--muted);margin:0 0 11px}
  .liste-sat{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .bos{text-align:center;padding:50px 20px;color:var(--muted)}
  .bos h3{color:var(--ink);font-size:18px;margin:0 0 7px}
  .notkart{background:#FAF8F2;border-radius:12px;padding:13px;font-size:14px;line-height:1.55}
  .notkart .d{font-size:12px;color:var(--muted);margin-top:6px}
  .chip{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--field);background:#fff;font-size:13.5px}
  .chip:hover{background:#f1eee4}
  .kaynak{display:inline-flex;align-items:center;gap:7px;background:#F2EFE5;border:none;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:13px 20px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;max-width:90vw}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .yaz{display:flex;gap:10px;margin-bottom:12px}
  .yaz input{min-height:52px;font-size:16px;border:1.5px solid var(--green);border-radius:13px}
  .yaz button{min-height:52px;padding:0 24px;border-radius:13px;border:none;background:var(--green);color:#fff;font-size:16px;font-weight:600;flex:none}
  /* ---- ses ---- */
  .mikbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 20px;border-radius:13px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:15px;font-weight:600;flex:none}
  .mikbtn:hover{background:var(--green-soft)}
  .mikbtn.kayitta{background:var(--red);border-color:var(--red);color:#fff;animation:nabiz 1.6s ease-in-out infinite}
  .mikbtn:disabled{opacity:.45;cursor:not-allowed}
  @keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(138,63,18,.45)}50%{box-shadow:0 0 0 9px rgba(138,63,18,0)}}
  .seviye{display:flex;align-items:center;gap:3px;height:34px}
  .seviye i{display:block;width:5px;border-radius:3px;background:var(--line);height:6px;transition:height .07s linear,background .07s linear}
  .seviye i.on{background:var(--green)}
  .seviye i.yuksek{background:var(--red)}
  .seskutu{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .sesbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .sure{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;min-width:62px}
  .dalga{flex:1 1 180px;min-width:120px;height:34px;display:flex;align-items:center;gap:2px;overflow:hidden}
  .dalga i{display:block;flex:1 1 auto;min-width:2px;max-width:5px;border-radius:2px;background:var(--green-line);height:4px}
  .supheli{border-color:var(--red)!important;background:var(--red-bg)!important}
  .rozet-supheli{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:999px;padding:3px 8px;margin-left:7px}
  .duyulan{background:#FAF8F2;border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:15px;line-height:1.6}
  @media (max-width:1150px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:900px){ .grid2,.grid3{grid-template-columns:1fr} }

  /* ---- telefon: yan menü alta iner, uygulama gibi dursun ---- */
  @media (max-width:760px){
    .app{flex-direction:column;height:auto;min-height:100vh;min-height:100dvh}
    .side{
      position:fixed;left:0;right:0;bottom:0;z-index:70;
      flex:none;flex-direction:row;gap:0;overflow:visible;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      border-top:1px solid #1E3A2E;
    }
    .side .brand,.side .side-foot{display:none}
    .nav{
      flex:1 1 0;min-width:0;flex-direction:column;gap:3px;
      padding:7px 2px;min-height:54px;font-size:11px;font-weight:600;
      text-align:center;align-items:center;justify-content:center;border-radius:12px;
    }
    .nav svg{width:21px;height:21px;flex:none}
    .nav.on{background:var(--dark2)}
    .main{
      flex:1 1 auto;overflow:visible;
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
    }
    body{overflow:auto}
    h1{font-size:23px}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .card{padding:14px}
    .card .v{font-size:22px}
    .box-p{padding:15px}
    .head{gap:11px;margin-bottom:16px}
    .cols{gap:15px}
    .col-main,.col-side{flex:1 1 100%}
    th,td{padding:11px 12px}
    .yaz{flex-wrap:wrap}
    .yaz input{flex:1 1 100%}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
    /* iOS: yazı alanına dokununca sayfayı yakınlaştırmasın */
    input,select,textarea{font-size:16px}
  }
  @media (max-width:420px){
    .cards{grid-template-columns:1fr}
    .nav{font-size:10px}
  }
  @media print{ .side{display:none} body{overflow:visible} .main{overflow:visible} }
</style>
</head>
<body>
<script>
/* Sunucu köprüsü: program kendi mini sunucusuyla çalıştığında kayıt
   işlemleri buradan gider. Dosyadan açıldığında devre dışı kalır. */
(function(){
  if (window.macar) return;
  // Köprü yalnızca programın kendi mini sunucusunda çalışır (127.0.0.1).
  // GitHub Pages gibi bir adreste açıldığında devreye girmemeli; orada
  // arka uç yoktur ve kayıtlar tarayıcı hafızasında tutulur.
  var y = location.hostname;
  var yerel = (y === "127.0.0.1" || y === "localhost" || y === "[::1]" || y === "::1");
  if (!yerel) return;
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  function j(u, o){
    return fetch(u, o).then(function(r){
      if(!r.ok) throw new Error("sunucu " + r.status);
      return r.json();
    });
  }
  function indir(veri){
    var d=new Date();
    var ad="macarzeka-yedek-"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    var b=new Blob([JSON.stringify(veri,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=ad;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
    return Promise.resolve({ok:true, yol:"İndirilenler klasörü · "+ad});
  }
  function sec(){
    return new Promise(function(coz){
      var g=document.createElement("input");
      g.type="file"; g.accept=".json,application/json";
      g.style.position="fixed"; g.style.left="-9999px";
      document.body.appendChild(g);
      g.onchange=function(){
        var f=g.files[0];
        if(!f){ g.remove(); coz({ok:false,iptal:true}); return; }
        var o=new FileReader();
        o.onload=function(){
          g.remove();
          try{
            var v=JSON.parse(o.result);
            if(!v||!Array.isArray(v.musteriler)) throw new Error("Bu dosya bir MacarZeka yedeği değil.");
            coz({ok:true, veri:v, yol:f.name});
          }catch(e){ coz({ok:false, hata:e.message}); }
        };
        o.onerror=function(){ g.remove(); coz({ok:false,hata:"Dosya okunamadı"}); };
        o.readAsText(f);
      };
      g.click();
    });
  }
  window.macar = {
    oku: function(){ return j("/api/oku"); },
    yaz: function(v){ return j("/api/yaz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)}); },
    yedekAl: indir,
    yedekYukle: sec,
    klasorAc: function(){ return j("/api/klasor"); },
    bilgi: function(){ return j("/api/bilgi"); },
    guncellemeBak: function(zorla){ return j("/api/guncelleme/bak"+(zorla?"?zorla=1":"")); },
    guncellemeKur: function(){ return j("/api/guncelleme/kur",{method:"POST"}); },
    goruntu: function(d){ return j("/api/goruntu",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}); },
    dinle: function(d){ return j("/api/dinle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}); },
    ayarlar: function(){ return j("/api/ayarlar"); },
    ayarKaydet: function(d){ return j("/api/ayarlar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}); },
    sor: function(d){ return j("/api/sor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}); }
  };
  /* pencere kapanınca program da kapansın diye yaşam sinyali */
  function nabiz(){ fetch("/api/nabiz",{method:"POST"}).catch(function(){}); }
  nabiz();
  setInterval(nabiz, 3000);
})();

/* ============================================================
   ZEKA KÖPRÜSÜ — Gemini ayarları, soru-cevap ve ses.
   Programda: arka uca gider (window.macar).
   Tarayıcıda (GitHub Pages): anahtar bu tarayıcıda saklanır,
   istek doğrudan Google'a gider. Komutlar Go koduyla birebir aynıdır.
   ============================================================ */
(function(){
  if (window.macar && window.macar.sor) {
    window.zeka = {
      yer: "program",
      ayarlar:    function(){  return window.macar.ayarlar(); },
      ayarKaydet: function(d){ return window.macar.ayarKaydet(d); },
      sor:        function(d){ return window.macar.sor(d); },
      dinle:      function(d){ return window.macar.dinle(d); },
      gor:        function(d){ return window.macar.goruntu(d); }
    };
    return;
  }
  var ANAHTAR = "macarzeka_ayar_v1";
  var UC = "https://generativelanguage.googleapis.com/v1beta";
  var V_MODEL = "gemini-3.5-flash-lite", V_SES = "gemini-3.8-flash";
  var Y_GORUNTU = "Sen bir tarım marketinin elle doldurulmuş veresiye/müşteri hesap kartının fotoğrafını okuyan araçsın.\nKartta üstte müşteri bilgileri (Adı Soyadı, T.C. No, Adres, Tel), altta bir tablo vardır:\nTarih | ÜRÜN | Adet | Tutar | Tahsilat | Bakiye. Kartın altında bir sayfa numarası (No ...) olabilir.\n\nGörevin bu kartı olduğu gibi okumak. ÇOK ÖNEMLİ KURALLAR:\n- Sadece kartta YAZAN şeyleri yaz. Okuyamadığın bir şeyi tahmin etme, uydurma.\n- Emin olmadığın her değeri \"supheli\" listesine ekle. Biçim: \"ad\", \"tc\", \"tel\", \"koy\" ya da\n  satırlar için \"satir3.tutar\" gibi (satır numarası 1'den başlar). Elle yazı okunurken hata\n  çok olur; dürüst ol, emin değilsen mutlaka supheli'ye koy.\n- Para: 33000, 82500 gibi sadece sayı yaz. Nokta/virgül/₺ koyma.\n- Tarih: kartta çoğu zaman yıl yazmaz (12.12, 07.11 gibi). Satırlar yukarıdan aşağıya\n  zaman sırasıyla yazılmıştır ve en alttaki satır bugünden sonra olamaz. Buna göre her\n  tarihe yıl ver ve YYYY-AA-GG biçiminde yaz. Örnek: bugün 2026-11-17 ise ve sıra\n  12.12, 29.07, 06.11 ise yıllar 2025, 2026, 2026 olur.\n- Her satır ya bir SATIŞ ya da bir TAHSİLAT'tır:\n  * Ürün/Adet/Tutar doluysa tur = \"satis\".\n  * Tahsilat sütunu doluysa ya da ürün yerine \"tahsilat\", \"ödeme\", \"havale\", \"nakit\" gibi\n    bir şey yazıyorsa tur = \"tahsilat\"; tutar alanına tahsil edilen miktarı yaz.\n- Adet sütununda sayının önünde \"ℓ\" ya da \"l\" işareti varsa bu litredir: miktar = \"15 lt\".\n  İşaret yoksa sadece sayıyı yaz.\n- Tahsilatlarda ödeme yöntemi yazıyorsa yontem şunlardan biri olsun:\n  Nakit, Havale / EFT, Kredi kartı, Çek, Senet. Yazmıyorsa boş bırak.\n- Bakiye sütununda bir rakam yazıyorsa o satırın bakiye alanına yaz (üstü çizilmiş\n  olsa bile). Tablodaki en son yazılı bakiyeyi sonBakiye'ye yaz.\n- Kartın üstünde \"vadeli\" gibi genel bir not varsa musteri.not alanına yaz.\n- Adres genelde köy ya da mahalle adıdır, koy alanına yaz.\n- Boş satırları atla.\n\nCevabını SADECE şu JSON biçiminde ver, başka hiçbir şey yazma, markdown kod bloğu kullanma:\n{\n  \"musteri\": { \"ad\": \"\", \"tc\": \"\", \"tel\": \"\", \"koy\": \"\", \"not\": \"\" },\n  \"sayfaNo\": \"\",\n  \"satirlar\": [\n    { \"tarih\": \"\", \"tur\": \"satis\", \"urun\": \"\", \"miktar\": \"\", \"tutar\": 0, \"yontem\": \"\", \"bakiye\": null }\n  ],\n  \"sonBakiye\": null,\n  \"supheli\": []\n}";
  var Y_SOR = "Sen bir ziraat mühendisinin müşteri defterini okuyan yardımcısısın.\nSana aşağıda o defterin tamamı verilecek; kullanıcının sorusunu YALNIZCA bu defterdeki bilgilere dayanarak cevapla.\n\nKurallar:\n- Türkçe, kısa ve net konuş. Gereksiz giriş cümlesi kurma, doğrudan cevabı ver.\n- Para tutarlarını \"12.500 ₺\" biçiminde yaz.\n- Tarihleri \"08.10.2026\" biçiminde yaz.\n- Defterde olmayan bir şey sorulursa \"Bu bilgi kayıtlarda yok\" de. Asla tahmin etme, uydurma.\n- Birden fazla kişi listelenecekse madde madde yaz.\n- Hesabı başkasının üstüne yazılı müşterilerde bunu mutlaka belirt.\n- Hesap yaparken dikkatli ol: kalan borç = toplam alış - toplam ödeme.\n- Kullanıcı defterde olmayan genel bir şey sorarsa (hava durumu, gübre tavsiyesi gibi)\n  kısaca bunun bu defterle ilgili olmadığını söyle.", Y_METIN = "Sen Türkçe konuşmayı yazıya çeviren bir araçsın.\nDuyduğun konuşmayı olduğu gibi, Türkçe yazım kurallarına uygun yaz.\nSadece yazıya çevrilmiş metni ver; açıklama, başlık, tırnak ekleme.\nKonuşmada anlamadığın bir yer varsa oraya [anlaşılmadı] yaz.\nSes boşsa veya hiç konuşma yoksa yalnızca [ses yok] yaz.", Y_FORM = "Sen bir ziraat mühendisinin sesli notunu müşteri kayıt formuna çeviren araçsın.\nÖnce konuşmayı Türkçe olarak yazıya çevir, sonra içinden form alanlarını çıkar.\n\nÇOK ÖNEMLİ KURALLAR:\n- Yalnızca konuşmada GEÇEN bilgileri doldur. Geçmeyen alanı boş bırak. ASLA tahmin etme, uydurma.\n- Para: \"sekiz bin lira\" -> 8000, \"on iki bin beş yüz\" -> 12500. Sadece sayı yaz, \"₺\" yazma.\n- Tarih: YYYY-AA-GG biçiminde. \"bugün\" -> bugünün tarihi, \"dün\" -> bir önceki gün,\n  \"geçen hafta\" gibi belirsizse boş bırak.\n- Ödeme yöntemi yalnızca şunlardan biri olabilir: Nakit, Havale / EFT, Kredi kartı, Çek, Senet.\n  Konuşmada geçmiyorsa boş bırak.\n- İlişki yalnızca şunlardan biri olabilir: Babası, Oğlu, Kardeşi, Eşi, Ortağı, Kiracısı, Akrabası.\n- \"falancanın hesabına yazılsın\", \"hesap babasının üstüne\" gibi bir ifade geçerse,\n  sana verilen MEVCUT MÜŞTERİLER listesinden o kişiyi bul ve hesapSahibiId alanına\n  o kişinin id'sini yaz. Listede yoksa hesapSahibiId'yi boş bırak, adını hesapSahibiAd'a yaz.\n- Konuşmada geçen ama forma girmeyen her şeyi (tarla durumu, hastalık, söz verilen şeyler)\n  \"not\" alanına yaz.\n- Net duyamadığın, emin olmadığın her alanın adını \"supheli\" listesine ekle. Dürüst ol:\n  emin değilsen mutlaka supheli'ye koy. Bu liste kullanıcının kontrol edeceği alanları gösterir.\n\nCevabını SADECE şu JSON biçiminde ver, başka hiçbir şey yazma, markdown kod bloğu kullanma:\n{\n  \"metin\": \"konuşmanın aynen yazıya çevrilmiş hali\",\n  \"ad\": \"\", \"tel\": \"\", \"koy\": \"\", \"arazi\": \"\",\n  \"urun\": \"\", \"miktar\": \"\", \"tarih\": \"\", \"tutar\": 0,\n  \"odenen\": 0, \"yontem\": \"\", \"odemeTarihi\": \"\", \"vade\": \"\", \"vadeNot\": \"\",\n  \"hesapSahibiId\": \"\", \"hesapSahibiAd\": \"\", \"iliski\": \"\",\n  \"not\": \"\",\n  \"supheli\": []\n}";
  var EN_BUYUK_SES = 13*1024*1024;

  function oku(){
    var a={ gemini_anahtar:"", gemini_model:V_MODEL, gemini_ses_model:V_SES, gemini_acik:false, mikrofon_id:"", mikrofon_ad:"" };
    try{ var h=JSON.parse(localStorage.getItem(ANAHTAR)||"null"); if(h&&typeof h==="object") for(var k in a) if(h[k]!==undefined) a[k]=h[k]; }catch(e){}
    if(!a.gemini_model) a.gemini_model=V_MODEL;
    if(!a.gemini_ses_model) a.gemini_ses_model=V_SES;
    return a;
  }
  function yaz(a){ try{ localStorage.setItem(ANAHTAR, JSON.stringify(a)); return true; }catch(e){ return false; } }
  function maske(k){ k=String(k||"").trim(); if(!k) return ""; return k.length<=4?"••••":"••••••••"+k.slice(-4); }
  function cevap(a){ return { ok:true, model:a.gemini_model, sesModel:a.gemini_ses_model, acik:!!a.gemini_acik,
    anahtarVar:!!a.gemini_anahtar, anahtarMaske:maske(a.gemini_anahtar), mikrofonId:a.mikrofon_id||"", mikrofonAd:a.mikrofon_ad||"" }; }
  function kisalt(s){ s=String(s||"").trim(); return s.length>220?s.slice(0,220)+"…":s; }

  function istek(model, govde, sure){
    var a=oku(), ak=String(a.gemini_anahtar||"").trim();
    if(!ak) return Promise.resolve({ hata:"Gemini anahtarı girilmemiş. Ayarlar ekranından anahtarı yapıştır." });
    var dur = window.AbortController ? new AbortController() : null;
    var zaman = dur ? setTimeout(function(){ dur.abort(); }, sure) : null;
    return fetch(UC+"/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(ak), {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(govde),
      signal: dur?dur.signal:undefined
    }).then(function(r){
      return r.text().then(function(t){
        var j={}; try{ j=JSON.parse(t); }catch(e){}
        return { kod:r.status, j:j };
      });
    }).catch(function(e){
      return { hata: (e && e.name==="AbortError") ? "Google zamanında cevap vermedi. Tekrar dene."
                                                  : "Google'a bağlanılamadı. İnternet bağlantısını kontrol et." };
    }).then(function(x){ if(zaman) clearTimeout(zaman); return x; });
  }
  function metniAl(j){
    var b=""; ((j&&j.candidates)||[]).forEach(function(c){ (((c||{}).content||{}).parts||[]).forEach(function(p){ if(p&&p.text) b+=p.text; }); });
    return b.trim();
  }
  function soruHata(kod, m, model){
    var al=String(m||"").toLowerCase();
    if(kod===400 && al.indexOf("api key")>=0) return "Anahtar geçersiz görünüyor. Ayarlar'dan tekrar kontrol et.";
    if(kod===400) return "İstek reddedildi (400). Model adı yanlış olabilir: "+model+". Google'ın mesajı: "+kisalt(m);
    if(kod===401||kod===403) return "Anahtar kabul edilmedi (yetki hatası). Google AI Studio'dan yeni bir anahtar al ve Ayarlar'a yapıştır.";
    if(kod===404) return "Model bulunamadı: "+model+". Ayarlar'dan başka bir model seç.";
    if(kod===429) return "Google kotası doldu (429). Biraz bekleyip tekrar dene; ücretsiz kullanımda dakikalık sınır vardır.";
    if(kod>=500) return "Google tarafında geçici sorun ("+kod+"). Birazdan tekrar dene.";
    return "Beklenmeyen cevap ("+kod+"): "+kisalt(m);
  }
  function sesHata(kod, m, model){
    var al=String(m||"").toLowerCase();
    if(kod===400 && (al.indexOf("audio")>=0||al.indexOf("modalit")>=0||al.indexOf("mime")>=0||al.indexOf("not supported")>=0))
      return "Seçili ses modeli ("+model+") ses kaydını kabul etmedi. Ayarlar'dan başka bir ses modeli seç. Google'ın mesajı: "+kisalt(m);
    if(kod===413) return "Kayıt çok uzun geldi. Daha kısa konuşup dene.";
    return soruHata(kod, m, model).replace("Model bulunamadı","Ses modeli bulunamadı");
  }
  function temizMetin(s){
    s=String(s||"").trim();
    if(s.indexOf("```")===0){ var i=s.indexOf("\n"); if(i>=0) s=s.slice(i+1); s=s.replace(/```\s*$/,"").trim(); }
    if(s.length>=2 && s[0]==='"' && s[s.length-1]==='"'){ try{ var c=JSON.parse(s); if(typeof c==="string") s=c; }catch(e){} }
    return s.trim();
  }
  function jsonAyikla(s){
    s=temizMetin(s); var b=s.indexOf("{"), e=s.lastIndexOf("}");
    if(b<0||e<=b) return null;
    try{ var o=JSON.parse(s.slice(b,e+1)); return (o&&typeof o==="object")?o:null; }catch(x){ return null; }
  }
  function sesYok(t){ return !t || String(t).toLowerCase().indexOf("[ses yok]")>=0; }

  window.zeka = {
    yer: "tarayici",
    gor: function(g){
      var a=oku(); g=g||{};
      var b64=String(g.resim||""), ham=Math.floor(b64.length*3/4);
      if(ham>EN_BUYUK_SES) return Promise.resolve({ ok:false, hata:"Fotoğraf çok büyük ("+Math.round(ham/1048576)+" MB). Daha küçük bir fotoğraf dene." });
      if(ham<2000) return Promise.resolve({ ok:false, hata:"Fotoğraf boş ya da bozuk geldi." });
      var model=a.gemini_ses_model||V_SES;
      var tip=String(g.tip||"image/jpeg").split(";")[0].trim(); if(tip.indexOf("image/")!==0) tip="image/jpeg";
      function govde(jsonIste){
        // Gemini 3 varsayılan olarak "çok düşünür": hem yavaşlar hem cevap yarıda kesilir.
        // Düşünmeyi kıs, cevaba bol yer bırak. Model bu alanları tanımazsa yedek istek sade gider.
        var u={ maxOutputTokens:16384 };
        if(jsonIste){ u.response_mime_type="application/json"; u.thinkingConfig={ thinkingLevel:"low" }; }
        return { system_instruction:{ parts:[{ text:Y_GORUNTU }] },
                 contents:[{ parts:[{ text:"Bu müşteri hesap kartını oku. BUGÜNÜN TARİHİ: "+(g.bugun||"") }, { inline_data:{ mime_type:tip, data:b64 } }] }],
                 generationConfig:u };
      }
      function bitir(x){
        if(x.hata) return { ok:false, hata:x.hata };
        var j=x.j||{};
        if(x.kod!==200) return { ok:false, hata:sesHata(x.kod,(j.error||{}).message,model).replace("ses kaydını","fotoğrafı") };
        if(j.promptFeedback && j.promptFeedback.blockReason) return { ok:false, hata:"Google bu fotoğrafı işlemedi ("+j.promptFeedback.blockReason+")." };
        var o=jsonAyikla(metniAl(j));
        if(!o){
          var bitis=String((((j.candidates||[])[0])||{}).finishReason||"");
          if(bitis==="MAX_TOKENS") return { ok:false, hata:"Google cevabı yarıda kesti. Tekrar dene; olmazsa sayfayı ikiye bölüp ayrı ayrı yükle." };
          return { ok:false, hata:"Fotoğraf okunamadı. Daha net ve düz çekilmiş bir fotoğraf dene." };
        }
        return { ok:true, veri:o, model:model };
      }
      return istek(model, govde(true), 90000).then(function(x){
        var m=String(((x.j||{}).error||{}).message||"").toLowerCase();
        if(x.kod===400 && (m.indexOf("response_mime_type")>=0||m.indexOf("responsemimetype")>=0||m.indexOf("unknown name")>=0||m.indexOf("invalid json payload")>=0||m.indexOf("thinking")>=0))
          return istek(model, govde(false), 90000).then(bitir);
        return bitir(x);
      });
    },
    ayarlar: function(){ return Promise.resolve(cevap(oku())); },
    ayarKaydet: function(g){
      var a=oku(); g=g||{};
      if(g.anahtar!==undefined) a.gemini_anahtar=String(g.anahtar||"").trim();
      if(g.model && String(g.model).trim()) a.gemini_model=String(g.model).trim();
      if(g.sesModel && String(g.sesModel).trim()) a.gemini_ses_model=String(g.sesModel).trim();
      if(g.acik!==undefined) a.gemini_acik=!!g.acik;
      if(g.mikrofonId!==undefined) a.mikrofon_id=String(g.mikrofonId||"").trim();
      if(g.mikrofonAd!==undefined) a.mikrofon_ad=String(g.mikrofonAd||"").trim();
      if(!a.gemini_anahtar) a.gemini_acik=false;
      if(!yaz(a)) return Promise.resolve({ ok:false, hata:"Ayarlar tarayıcıya yazılamadı." });
      return Promise.resolve(cevap(a));
    },
    sor: function(g){
      var a=oku(); g=g||{};
      if(!g.deneme && !a.gemini_acik) return Promise.resolve({ ok:false, hata:"Gemini kapali" });
      var model=a.gemini_model||V_MODEL;
      return istek(model, {
        system_instruction:{ parts:[{ text:Y_SOR }] },
        contents:[{ parts:[{ text:"=== MÜŞTERİ DEFTERİ ===\n"+(g.baglam||"")+"\n\n=== SORU ===\n"+(g.soru||"") }] }],
        generationConfig:{ temperature:0.2, maxOutputTokens:1500 }
      }, 60000).then(function(x){
        if(x.hata) return { ok:false, hata:x.hata };
        var j=x.j||{};
        if(x.kod!==200) return { ok:false, hata:soruHata(x.kod, (j.error||{}).message, model) };
        if(j.promptFeedback && j.promptFeedback.blockReason) return { ok:false, hata:"Google bu soruyu yanıtlamadı ("+j.promptFeedback.blockReason+")." };
        var t=metniAl(j);
        if(!t){
          var fr=((j.candidates||[])[0]||{}).finishReason;
          return { ok:false, hata: fr ? "Boş cevap geldi ("+fr+"). Soruyu biraz farklı yazıp dene." : "Google boş cevap döndürdü. Birazdan tekrar dene." };
        }
        return { ok:true, cevap:t, model:model };
      });
    },
    dinle: function(g){
      var a=oku(); g=g||{};
      var b64=String(g.ses||""), ham=Math.floor(b64.length*3/4);
      if(ham>EN_BUYUK_SES) return Promise.resolve({ ok:false, hata:"Kayıt çok uzun ("+Math.round(ham/1048576)+" MB). En fazla 3 dakika konuş, sonra kaydet." });
      if(ham<1200) return Promise.resolve({ ok:false, hata:"Ses kaydı boş geldi. Mikrofon çalışmıyor olabilir; Ayarlar'dan mikrofonu dene." });
      var model=a.gemini_ses_model||V_SES, form=(g.amac==="form");
      var tip=String(g.tip||"audio/webm").split(";")[0].trim()||"audio/webm";
      var istem=(form?"Bu sesli notu yazıya çevir ve form alanlarını çıkar.":"Bu ses kaydını Türkçe yazıya çevir.")+(g.baglam?"\n\n"+g.baglam:"");
      function govde(jsonIste){
        var u={ temperature:0.1, maxOutputTokens:3000 };
        if(jsonIste) u.response_mime_type="application/json";
        return { system_instruction:{ parts:[{ text: form?Y_FORM:Y_METIN }] },
                 contents:[{ parts:[{ text:istem }, { inline_data:{ mime_type:tip, data:b64 } }] }],
                 generationConfig:u };
      }
      function bitir(x){
        if(x.hata) return { ok:false, hata:x.hata };
        var j=x.j||{};
        if(x.kod!==200) return { ok:false, hata:sesHata(x.kod, (j.error||{}).message, model) };
        if(j.promptFeedback && j.promptFeedback.blockReason) return { ok:false, hata:"Google bu kaydı işlemedi ("+j.promptFeedback.blockReason+")." };
        var t=metniAl(j);
        if(!t) return { ok:false, hata:"Google boş cevap döndürdü. Tekrar konuşmayı dene." };
        if(!form){
          var m=temizMetin(t);
          if(sesYok(m)) return { ok:false, hata:"Konuşma duyulmadı. Mikrofona daha yakın ve yüksek sesle konuş." };
          return { ok:true, metin:m, model:model };
        }
        var o=jsonAyikla(t);
        if(!o){
          var k=temizMetin(t);
          if(sesYok(k)) return { ok:false, hata:"Konuşma duyulmadı. Mikrofona daha yakın ve yüksek sesle konuş." };
          return { ok:true, metin:k, veri:null, model:model };
        }
        var mt=temizMetin(o.metin||"");
        if(sesYok(mt)) return { ok:false, hata:"Konuşma duyulmadı. Mikrofona daha yakın ve yüksek sesle konuş." };
        return { ok:true, metin:mt, veri:o, model:model };
      }
      return istek(model, govde(form), 180000).then(function(x){
        // Bazı modeller response_mime_type alanını tanımaz: o alan olmadan bir kez daha dene.
        var m=String(((x.j||{}).error||{}).message||"").toLowerCase();
        if(form && x.kod===400 && (m.indexOf("response_mime_type")>=0||m.indexOf("responsemimetype")>=0||m.indexOf("unknown name")>=0||m.indexOf("invalid json payload")>=0))
          return istek(model, govde(false), 180000).then(bitir);
        return bitir(x);
      });
    }
  };
})();

    <button class="nav" data-git="ayarlar"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4m0-12.8L17 7M7 17l-1.4 1.4"/></svg> Ayarlar</button>
    <div class="side-foot">
      <div class="kayit-durum" id="durum">Açılıyor…</div>
      <button class="mini" id="klasorAc">📁 Veri klasörünü aç</button>
      <button class="mini" id="yedekAl">⬇ Yedek al</button>
      <button class="mini" id="yedekYukle">⬆ Yedekten geri yükle</button>
      <input type="file" id="dosyaSec" accept=".json,application/json" class="sr">
    </div>
  </nav>
  <main class="main" id="ekran"></main>
</div>

<script>
"use strict";
/* ============================================================
   MacarZeka — müşteri / satış / ödeme / bağlantı takibi
   Masaüstünde veriler.json'a otomatik kaydeder.
   ============================================================ */

var SURUM = "1.0";
var ANAHTAR = "macarzeka_veri_v1";
var MASAUSTU = !!(window.macar && window.macar.oku);

var veri = { surum:1, musteriler:[], satislar:[], odemeler:[] };
var gorunum = { ad:"panel", musteriId:null, filtre:"hepsi", arama:"", koy:"", mod:"yeni", soru:"", cevap:null, yerel:null,
  sesIsliyor:null, sesHata:"", sesForm:null, sesMetin:"",
  guncelleme:null, guncellemeHata:"", guncellemeBakHata:"", guncellemeKuruluyor:false, guncellemeDepo:"" };
var ayar = { acik:false, model:"", sesModel:"", anahtarVar:false, anahtarMaske:"", mikrofonId:"", mikrofonAd:"" };
var bilgi = { dosya:"", klasor:"" };
var sonKayit = null, kayitHata = null, yazmaBekle = null, kirli = false;

/* ---------- yardımcılar ---------- */
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function norm(s){
  s = String(s==null?"":s).toLocaleLowerCase("tr");
  var h={"ı":"i","İ":"i","ş":"s","ğ":"g","ü":"u","ö":"o","ç":"c","â":"a","î":"i","û":"u"};
  return s.replace(/[ıİşğüöçâîû]/g,function(c){return h[c]||c;}).replace(/\s+/g," ").trim();
}
function para(n){
  n = Number(n)||0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₺";
}
function bugun(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function trTarih(iso){
  if(!iso) return "—";
  var p=String(iso).slice(0,10).split("-");
  if(p.length!==3) return iso;
  return p[2]+"."+p[1]+"."+p[0];
}
function gunFark(iso){
  if(!iso) return null;
  var a=new Date(iso+"T00:00:00"), b=new Date(bugun()+"T00:00:00");
  if(isNaN(a)) return null;
  return Math.round((b-a)/86400000);
}
function saat(){
  var d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function bashar(ad){
  var p=String(ad||"").trim().split(/\s+/);
  return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toLocaleUpperCase("tr");
}
function el(h){ var d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstChild; }
function toast(msg){
  var t=document.querySelector(".toast"); if(t) t.remove();
  var d=el('<div class="toast">'+esc(msg)+'</div>');
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.remove(); },3200);
}

/* ---------- hesaplar ---------- */
function msAl(mid){ return veri.musteriler.filter(function(m){return m.id===mid;})[0]||null; }
function satislari(mid){ return veri.satislar.filter(function(s){return s.musteriId===mid;}).sort(function(a,b){return (b.tarih||"").localeCompare(a.tarih||"");}); }
function odemeleri(mid){ return veri.odemeler.filter(function(o){return o.musteriId===mid;}).sort(function(a,b){return (b.tarih||"").localeCompare(a.tarih||"");}); }
function toplamAlis(mid){ var t=0; veri.satislar.forEach(function(s){ if(s.musteriId===mid) t+=Number(s.tutar)||0; }); return t; }
function toplamOdeme(mid){ var t=0; veri.odemeler.forEach(function(o){ if(o.musteriId===mid) t+=Number(o.tutar)||0; }); return t; }
function borc(mid){ return Math.max(0, toplamAlis(mid)-toplamOdeme(mid)); }
function enYakinVade(mid){
  var v=null;
  satislari(mid).forEach(function(s){ if(s.vade && (!v || s.vade<v)) v=s.vade; });
  return v;
}
function durum(mid){
  var b=borc(mid);
  if(b<=0) return {tip:"ok",yazi:"Temiz"};
  var v=enYakinVade(mid), f=v?gunFark(v):null;
  if(f!==null && f>0) return {tip:"borc",yazi:f+" gün gecikti"};
  if(v) return {tip:"vade",yazi:trTarih(v)+" vadeli"};
  return {tip:"borc",yazi:"Borç var"};
}
function bagliOlanlar(mid){
  var liste=[], m=msAl(mid);
  if(m && m.hesapSahibiId){
    var h=msAl(m.hesapSahibiId);
    if(h) liste.push({m:h, aciklama:"Hesap bunun üstüne yazılı"+(m.iliski?" ("+m.iliski+")":"")});
  }
  veri.musteriler.forEach(function(x){
    if(x.hesapSahibiId===mid) liste.push({m:x, aciklama:"Hesabı bunun üstünde"+(x.iliski?" ("+x.iliski+")":"")});
  });
  return liste;
}
function borclular(){
  return veri.musteriler.filter(function(m){ return borc(m.id)>0; })
    .sort(function(a,b){
      var va=enYakinVade(a.id), vb=enYakinVade(b.id);
      var fa=va?gunFark(va):-9999, fb=vb?gunFark(vb):-9999;
      if(fb!==fa) return fb-fa;
      return borc(b.id)-borc(a.id);
    });
}
function ayBasi(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
}

/* ---------- kayıt ---------- */
function durumYaz(){
  var d=document.getElementById("durum");
  if(!d) return;
  if(MASAUSTU){
    if(kayitHata) d.innerHTML='<b style="color:#F3B48A">⚠️ KAYDEDİLEMEDİ</b><br>'+esc(kayitHata)+'<br>Yedek al ve bana haber ver.';
    else if(sonKayit) d.innerHTML='✅ Kaydedildi <b style="color:#fff">'+esc(sonKayit)+'</b><br><span style="font-size:11px">'+esc(bilgi.dosya||"")+'</span>';
    else d.innerHTML='Veriler şuraya kaydediliyor:<br><span style="font-size:11px;color:#fff">'+esc(bilgi.dosya||"veriler.json")+'</span>';
  } else {
    d.innerHTML='✅ Otomatik kaydediliyor';
  }
}
function hafizayaYaz(){ try{ localStorage.setItem(ANAHTAR, JSON.stringify(veri)); }catch(e){} }
function hafizadanOku(){
  try{
    var s=localStorage.getItem(ANAHTAR);
    if(s){ var v=JSON.parse(s); if(v&&v.musteriler) veri=v; }
  }catch(e){}
}
function kaydet(){
  if(!MASAUSTU){ hafizayaYaz(); kirli=true; durumYaz(); return; }
  if(yazmaBekle) clearTimeout(yazmaBekle);
  yazmaBekle=setTimeout(function(){
    window.macar.yaz(veri).then(function(r){
      if(r && r.ok){ sonKayit=saat(); kayitHata=null; }
      else { kayitHata=(r&&r.hata)||"bilinmeyen hata"; toast("DİKKAT: Kayıt yazılamadı — "+kayitHata); }
      durumYaz();
    }).catch(function(e){
      kayitHata=e.message; durumYaz(); toast("DİKKAT: Kayıt yazılamadı — "+e.message);
    });
  },150);
}
function yedekAl(){
  if(MASAUSTU){
    window.macar.yedekAl(veri).then(function(r){
      if(r && r.ok) toast("Yedek kaydedildi: "+r.yol);
      else if(r && !r.iptal) toast("Yedek alınamadı: "+(r.hata||""));
    });
    return;
  }
  var ad="macarzeka-yedek-"+bugun()+".json";
  var b=new Blob([JSON.stringify(veri,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=ad;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  kirli=false;
  toast("Yedek indirildi: "+ad);
}
function yedekYukleBaslat(){
  if(MASAUSTU){
    window.macar.yedekYukle().then(function(r){
      if(!r || r.iptal) return;
      if(!r.ok){ toast("Okunamadı: "+(r.hata||"")); return; }
      if(!confirm("Şu anki bütün kayıtlar silinip yedektekiler yüklenecek.\n\nYedekteki müşteri sayısı: "+r.veri.musteriler.length+"\nŞu anki müşteri sayısı: "+veri.musteriler.length+"\n\nDevam edilsin mi?")) return;
      veri=r.veri; kaydet(); ciz(); toast("Yedek yüklendi");
    });
  } else {
    document.getElementById("dosyaSec").click();
  }
}
function dosyadanYukle(dosya){
  var r=new FileReader();
  r.onload=function(){
    try{
      var v=JSON.parse(r.result);
      if(!v || !v.musteriler) throw new Error("Tanınmayan dosya");
      if(!confirm("Şu anki bütün kayıtlar silinip yedektekiler yüklenecek.\n\nDevam edilsin mi?")) return;
      veri=v; kaydet(); ciz(); toast("Yedek yüklendi: "+v.musteriler.length+" müşteri");
    }catch(e){ toast("Dosya okunamadı: "+e.message); }
  };
  r.readAsText(dosya);
}

/* ---------- SORU SOR ---------- */
function musteriBul(s){
  var tcler=String(s).match(/\b[1-9][0-9]{10}\b/g);
  if(tcler){ for(var q=0;q<tcler.length;q++){ var bt=tcSahibi(tcler[q],null); if(bt) return bt; } }
  var n=norm(s), bulunan=null, enUzun=0;
  veri.musteriler.forEach(function(m){
    var a=norm(m.ad);
    if(a && n.indexOf(a)>=0 && a.length>enUzun){ bulunan=m; enUzun=a.length; }
  });
  if(bulunan) return bulunan;
  veri.musteriler.forEach(function(m){
    norm(m.ad).split(" ").forEach(function(p){
      if(p.length>2 && n.indexOf(p)>=0 && p.length>enUzun){ bulunan=m; enUzun=p.length; }
    });
  });
  return bulunan;
}
function kisiOzeti(m){
  var ta=toplamAlis(m.id), to=toplamOdeme(m.id), b=borc(m.id), v=enYakinVade(m.id);
  var c = "<b>"+esc(m.ad)+"</b>'ın toplam "+para(ta)+" alışı var, "+para(to)+" ödedi. ";
  if(b<=0) c += "<b style='color:var(--green)'>Borcu yok.</b> ";
  else{
    c += "<b style='color:var(--red)'>"+para(b)+" borcu kaldı.</b> ";
    if(v){
      var f=gunFark(v);
      c += (f!==null && f>0) ? ("Vadesi "+trTarih(v)+"'de doldu, <b>"+f+" gün gecikti</b>. ") : ("Vadesi "+trTarih(v)+". ");
    }
  }
  if(m.hesapSahibiId){ var h=msAl(m.hesapSahibiId); if(h) c += "Hesap kendi adına değil, <b>"+esc(h.ad)+"</b>'ın üstüne yazılı. "; }
  var ustunde = veri.musteriler.filter(function(x){return x.hesapSahibiId===m.id;});
  if(ustunde.length) c += "Ayrıca "+ustunde.map(function(x){return "<b>"+esc(x.ad)+"</b>";}).join(", ")+" bunun hesabından alıyor. ";
  return c;
}
/* Defterin tamamını Gemini'ye gönderilecek düz metne çevirir. */
/* ---------- TC Kimlik No ---------- */
function tcTemizle(v){ return String(v==null?"":v).replace(/\D/g,""); }
// Resmî algoritma: 11 hane, ilk hane 0 değil, 10. ve 11. haneler denetim hanesi.
function tcGecerli(v){
  var t=tcTemizle(v);
  if(!/^[1-9][0-9]{10}$/.test(t)) return false;
  var d=t.split("").map(Number);
  var tek=d[0]+d[2]+d[4]+d[6]+d[8], cift=d[1]+d[3]+d[5]+d[7];
  if(((tek*7-cift)%10+10)%10!==d[9]) return false;
  var top=0; for(var i=0;i<10;i++) top+=d[i];
  return top%10===d[10];
}
function tcSahibi(t, haric){
  t=tcTemizle(t); if(!t) return null;
  return veri.musteriler.filter(function(m){ return m.id!==haric && tcTemizle(m.tc)===t; })[0]||null;
}
function tcDurumHTML(v){
  var t=tcTemizle(v);
  if(!t) return "";
  if(t.length<11) return '<span style="color:var(--muted)">'+t.length+'/11 hane</span>';
  return tcGecerli(t) ? '<span style="color:var(--green);font-weight:600">✓ Geçerli TC</span>'
                      : '<span style="color:var(--red);font-weight:600">✗ Hatalı TC — rakamları kontrol et</span>';
}

/* Not: TC Kimlik No Gemini'ye giden deftere bilerek KONMAZ. */
function baglamKur(){
  var s=[];
  s.push("BUGÜNÜN TARİHİ: "+trTarih(bugun()));
  s.push("TOPLAM MÜŞTERİ: "+veri.musteriler.length);
  var genelBorc=0; veri.musteriler.forEach(function(m){ genelBorc+=borc(m.id); });
  s.push("TOPLAM KALAN ALACAK: "+para(genelBorc));
  s.push("");
  veri.musteriler.forEach(function(m,i){
    var b=borc(m.id), d=durum(m.id);
    var bas=[ "### "+(i+1)+". MÜŞTERİ: "+m.ad ];
    var kimlik=[];
    if(m.koy) kimlik.push("Köy: "+m.koy);
    if(m.tel) kimlik.push("Telefon: "+m.tel);
    if(m.arazi) kimlik.push("Arazi/ürün: "+m.arazi);
    if(kimlik.length) bas.push(kimlik.join(" | "));
    if(m.hesapSahibiId){
      var h=msAl(m.hesapSahibiId);
      if(h) bas.push("Hesabı KENDİ ADINA DEĞİL, "+h.ad+" adına yazılı"+(m.iliski?" ("+m.iliski+")":"")+".");
    }
    var ustunde=veri.musteriler.filter(function(x){return x.hesapSahibiId===m.id;});
    if(ustunde.length) bas.push("Bu kişinin hesabından alanlar: "+ustunde.map(function(x){return x.ad+(x.iliski?" ("+x.iliski+")":"");}).join(", "));
    bas.push("Toplam alış: "+para(toplamAlis(m.id))+" | Ödediği: "+para(toplamOdeme(m.id))+" | KALAN BORÇ: "+para(b)+" | Durum: "+d.yazi);

    var sl=satislari(m.id);
    if(sl.length){
      bas.push("Aldıkları:");
      sl.forEach(function(x){
        bas.push("  - "+x.urun+(x.miktar?" ("+x.miktar+")":"")+", "+trTarih(x.tarih)+", "+para(x.tutar)+
          (x.vade?", vade: "+trTarih(x.vade):"")+(x.vadeNot?", vade notu: "+x.vadeNot:""));
      });
    } else bas.push("Aldıkları: kayıt yok");

    var ol=odemeleri(m.id);
    if(ol.length){
      bas.push("Ödemeleri:");
      ol.forEach(function(x){
        bas.push("  - "+trTarih(x.tarih)+", "+para(x.tutar)+", "+(x.yontem||"yöntem belirtilmemiş")+(x.not?", not: "+x.not:""));
      });
    } else bas.push("Ödemeleri: kayıt yok");

    if((m.notlar||[]).length){
      bas.push("Notlar:");
      m.notlar.forEach(function(n){ bas.push("  - "+trTarih(n.tarih)+": "+n.metin); });
    }
    s.push(bas.join("\n"));
    s.push("");
  });
  return s.join("\n");
}

function cevapla(soru){
  var s=norm(soru);
  if(!s) return null;
  var m=musteriBul(soru), kaynaklar=[], rakamlar=null, metin="";

  /* Sorunun ne sorduğunu anlarken müşterinin adını cümleden çıkarıyoruz.
     Yoksa "Çağlayanoğlu" gibi bir soyadındaki "oğlu" ya da "Satılmış"
     gibi bir addaki kelime soruyu yanlış yöne çekiyor. */
  var sk = s;
  if(m){
    sk = sk.split(norm(m.ad)).join(" ");
    norm(m.ad).split(" ").forEach(function(p){ if(p.length>2) sk = sk.split(p).join(" "); });
    sk = sk.replace(/\s+/g," ").trim();
  }

  var sorBorc = /borc|odedi|odeme|kalan|alacak|tahsil|veresiye/.test(sk);
  var sorAlis = /ne ald|aldik|alis|satin|urun|gubre|ilac|tohum/.test(sk);
  var sorBag  = /hesab|hesap|bagl|kimin ust|kiminle|akraba|kardes|babas|(^|\s)oglu|ortag/.test(sk);
  var sorListe= /kimler|kim var|liste|hepsi|tum|herkes|borclu/.test(sk);
  var sorAy   = /bu ay|aylik|toplam|ne kadar sat|ciro/.test(sk);
  var sorNot  = /(^|\s)not(lar|u|um)?(\s|$)|ne dedi|ne soyled|konusma|gorusme/.test(sk);

  if(m){
    if(sorAlis && !sorBorc){
      var sl=satislari(m.id);
      if(!sl.length) metin = "<b>"+esc(m.ad)+"</b> adına kayıtlı alış yok.";
      else{
        metin = "<b>"+esc(m.ad)+"</b> şunları aldı:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
          sl.map(function(x){ return "<li>"+esc(x.urun)+(x.miktar?" ("+esc(x.miktar)+")":"")+" — "+para(x.tutar)+", "+trTarih(x.tarih)+"</li>"; }).join("")+"</ul>";
        sl.slice(0,6).forEach(function(x){ kaynaklar.push({t:"Satış · "+trTarih(x.tarih), mid:m.id}); });
      }
    } else if(sorBag && !sorBorc){
      var bg=bagliOlanlar(m.id);
      if(!bg.length) metin = "<b>"+esc(m.ad)+"</b> için kayıtlı bağlantı yok, kendi hesabından alıyor.";
      else metin = "<b>"+esc(m.ad)+"</b> şunlarla bağlantılı:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
        bg.map(function(x){ return "<li><b>"+esc(x.m.ad)+"</b> — "+esc(x.aciklama)+"</li>"; }).join("")+"</ul>";
    } else if(sorNot && !sorBorc && (m.notlar||[]).length){
      metin = "<b>"+esc(m.ad)+"</b> için tutulan notlar:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
        m.notlar.slice().reverse().map(function(n){ return "<li>"+esc(n.metin)+" <span style='color:var(--muted)'>("+trTarih(n.tarih)+")</span></li>"; }).join("")+"</ul>";
      m.notlar.slice(0,4).forEach(function(n){ kaynaklar.push({t:"Not · "+trTarih(n.tarih), mid:m.id}); });
    } else {
      metin = kisiOzeti(m);
      rakamlar = {a:toplamAlis(m.id), o:toplamOdeme(m.id), b:borc(m.id)};
      satislari(m.id).slice(0,3).forEach(function(x){ kaynaklar.push({t:"Satış · "+trTarih(x.tarih), mid:m.id}); });
      odemeleri(m.id).slice(0,3).forEach(function(x){ kaynaklar.push({t:"Ödeme · "+trTarih(x.tarih), mid:m.id}); });
      (m.notlar||[]).slice(0,2).forEach(function(x){ kaynaklar.push({t:"Not · "+trTarih(x.tarih), mid:m.id}); });
    }
    return {metin:metin, rakamlar:rakamlar, kaynaklar:kaynaklar, musteriId:m.id};
  }

  if(sorBorc || sorListe){
    var bl=borclular();
    if(!bl.length) metin = "Borcu olan kimse yok, bütün hesaplar temiz.";
    else{
      var t=0; bl.forEach(function(x){ t+=borc(x.id); });
      metin = "Şu an <b>"+bl.length+" kişinin</b> toplam <b style='color:var(--red)'>"+para(t)+"</b> borcu var:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
        bl.slice(0,20).map(function(x){
          var d=durum(x.id);
          return "<li><b>"+esc(x.ad)+"</b> — "+para(borc(x.id))+" <span style='color:var(--muted)'>("+esc(d.yazi)+")</span></li>";
        }).join("")+"</ul>";
      bl.slice(0,6).forEach(function(x){ kaynaklar.push({t:x.ad, mid:x.id}); });
    }
    return {metin:metin, rakamlar:null, kaynaklar:kaynaklar, musteriId:null};
  }

  if(sorAy){
    var bas=ayBasi(), sat=0, od=0;
    veri.satislar.forEach(function(x){ if((x.tarih||"")>=bas) sat+=Number(x.tutar)||0; });
    veri.odemeler.forEach(function(x){ if((x.tarih||"")>=bas) od+=Number(x.tutar)||0; });
    metin = "Bu ay toplam <b>"+para(sat)+"</b> satış yapıldı, <b style='color:var(--green)'>"+para(od)+"</b> tahsil edildi.";
    rakamlar = {a:sat, o:od, b:Math.max(0,sat-od)};
    return {metin:metin, rakamlar:rakamlar, kaynaklar:[], musteriId:null};
  }

  return {metin:"Bunu anlayamadım. Bir isim yazarsan o kişinin her şeyini söylerim; aşağıdaki hazır sorulara da tıklayabilirsin.", rakamlar:null, kaynaklar:[], musteriId:null};
}

/* ============================================================
   SES — mikrofon, canlı seviye, kayıt
   Ses hiçbir zaman diske yazılmaz; yalnızca bellekte tutulup gönderilir.
   ============================================================ */
var ses = {
  akis:null, kaydedici:null, parcalar:[], tip:"",
  ctx:null, analiz:null, tampon:null, olcer:null,
  baslangic:0, sayac:null, aktif:false, amac:null, hedef:null,
  mikrofonlar:[], izinVar:false, seviyeAcik:false, enYuksek:0, sonSeviye:0,
  olcumSayisi:0, iptal:false
};
var ENCOK_SANIYE = 180;

function sesDestekli(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function sesHazirMi(){
  return sesDestekli() && !!window.zeka && ayar.anahtarVar;
}
function sesNedenKapali(){
  if(!sesDestekli()) return "Bu pencere mikrofonu desteklemiyor.";
  if(!window.zeka) return "Sesli kayıt bu pencerede kullanılamıyor.";
  if(!ayar.anahtarVar) return "Sesli kayıt için Ayarlar'dan Gemini anahtarı girilmeli.";
  return "";
}

/* ---- mikrofon listesi ---- */
function mikrofonlariGetir(izinIste){
  if(!sesDestekli()) return Promise.resolve([]);
  var once = izinIste && !ses.izinVar
    ? navigator.mediaDevices.getUserMedia({audio:true}).then(function(a){
        ses.izinVar=true;
        a.getTracks().forEach(function(t){ t.stop(); });
      })
    : Promise.resolve();
  return once.then(function(){
    return navigator.mediaDevices.enumerateDevices();
  }).then(function(liste){
    var m=[];
    liste.forEach(function(d){
      if(d.kind==="audioinput"){
        m.push({ id:d.deviceId, ad:d.label || ("Mikrofon "+(m.length+1)) });
      }
    });
    ses.mikrofonlar=m;
    if(m.length && m[0].ad && m[0].ad.indexOf("Mikrofon ")!==0) ses.izinVar=true;
    return m;
  }).catch(function(e){
    ses.mikrofonlar=[];
    throw e;
  });
}

/* Kayıtlı mikrofonu bulur: önce id, olmazsa ada göre (fiş değişince id değişir). */
function seciliMikrofon(){
  var m=ses.mikrofonlar;
  if(!m.length) return null;
  var i;
  if(ayar.mikrofonId){
    for(i=0;i<m.length;i++) if(m[i].id===ayar.mikrofonId) return m[i];
  }
  if(ayar.mikrofonAd){
    for(i=0;i<m.length;i++) if(m[i].ad===ayar.mikrofonAd) return m[i];
  }
  return null;
}
function akisKisitlari(){
  var ayarlar = { echoCancellation:true, noiseSuppression:true, autoGainControl:true };
  var sec=seciliMikrofon();
  if(sec && sec.id) ayarlar.deviceId={ exact: sec.id };
  return { audio: ayarlar };
}

/* ---- canlı seviye ölçümü ---- */
function olcumBaslat(akis){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ses.ctx = new AC();
    // Tarayıcı ses motorunu askıya alabilir; ölçüm yapabilmek için uyandır.
    if(ses.ctx.state === "suspended" && ses.ctx.resume) { try{ ses.ctx.resume(); }catch(e){} }
    var kaynak = ses.ctx.createMediaStreamSource(akis);
    ses.analiz = ses.ctx.createAnalyser();
    ses.analiz.fftSize = 1024;
    ses.analiz.smoothingTimeConstant = 0.6;
    kaynak.connect(ses.analiz);
    ses.tampon = new Uint8Array(ses.analiz.fftSize);
    ses.enYuksek = 0; ses.olcumSayisi = 0;
    // Zamanlayıcı kullanıyoruz: pencere küçültülse veya arkada kalsa da ölçüm sürer.
    ses.olcer = setInterval(olcumDon, 60);
    olcumDon();
  }catch(e){ /* seviye gösterilemezse kayıt yine çalışır */ }
}
function olcumDon(){
  if(!ses.analiz){ return; }
  ses.analiz.getByteTimeDomainData(ses.tampon);
  var top=0, i, v;
  for(i=0;i<ses.tampon.length;i++){ v=(ses.tampon[i]-128)/128; top+=v*v; }
  var rms=Math.sqrt(top/ses.tampon.length);
  var yuzde=Math.min(100, Math.round(rms*260));
  ses.sonSeviye=yuzde;
  ses.olcumSayisi++;
  if(yuzde>ses.enYuksek) ses.enYuksek=yuzde;
  seviyeCiz(yuzde);
}
function seviyeCiz(yuzde){
  var kutular=document.querySelectorAll(".seviye i");
  if(kutular.length){
    var dolu=Math.round((yuzde/100)*kutular.length);
    for(var i=0;i<kutular.length;i++){
      var acik=i<dolu;
      kutular[i].style.height = acik ? (7+Math.round((i+1)/kutular.length*25))+"px" : "6px";
      kutular[i].className = acik ? (i>=kutular.length-3 ? "yuksek" : "on") : "";
    }
  }
  var d=document.querySelectorAll(".dalga i");
  if(d.length){
    for(var k=0;k<d.length;k++){
      var oran=Math.max(0.12, (yuzde/100)*(0.55+0.45*Math.sin((Date.now()/120)+k*0.7)));
      d[k].style.height=Math.max(4, Math.round(oran*30))+"px";
      d[k].style.background = yuzde>6 ? "var(--green)" : "var(--green-line)";
    }
  }
  var y=document.getElementById("seviyeYazi");
  if(y){
    y.textContent = yuzde<4 ? "Ses gelmiyor" : (yuzde<12 ? "Çok kısık" : (yuzde>88 ? "Çok yüksek" : "İyi"));
    y.style.color = (yuzde<4||yuzde>88) ? "var(--red)" : (yuzde<12 ? "var(--warn)" : "var(--green)");
  }
}
function olcumDurdur(){
  if(ses.olcer){ clearInterval(ses.olcer); ses.olcer=null; }
  ses.analiz=null; ses.tampon=null;
  if(ses.ctx){ try{ ses.ctx.close(); }catch(e){} ses.ctx=null; }
  seviyeCiz(0);
}

/* ---- sadece seviye göstergesi (Ayarlar'daki mikrofon denemesi) ---- */
function seviyeAc(){
  if(ses.aktif) return Promise.resolve(false);
  seviyeKapat();
  return navigator.mediaDevices.getUserMedia(akisKisitlari()).then(function(a){
    ses.izinVar=true; ses.akis=a; ses.seviyeAcik=true;
    olcumBaslat(a);
    return true;
  });
}
function seviyeKapat(){
  if(ses.aktif) return;
  olcumDurdur();
  if(ses.akis){ ses.akis.getTracks().forEach(function(t){ t.stop(); }); ses.akis=null; }
  ses.seviyeAcik=false;
}

/* ---- kayıt ---- */
function sesTipiSec(){
  var adaylar=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/ogg","audio/mp4"];
  for(var i=0;i<adaylar.length;i++){
    try{ if(window.MediaRecorder.isTypeSupported(adaylar[i])) return adaylar[i]; }catch(e){}
  }
  return "";
}

function kayitBaslat(amac, hedef){
  if(ses.aktif) return Promise.resolve(false);
  var neden=sesNedenKapali();
  if(neden){ toast(neden); return Promise.resolve(false); }

  seviyeKapat();
  ses.amac=amac; ses.hedef=hedef||null; ses.iptal=false;

  return navigator.mediaDevices.getUserMedia(akisKisitlari()).then(function(a){
    ses.izinVar=true; ses.akis=a; ses.parcalar=[];
    ses.tip=sesTipiSec();
    var sec = ses.tip ? { mimeType: ses.tip, audioBitsPerSecond: 32000 } : {};
    try{ ses.kaydedici=new MediaRecorder(a, sec); }
    catch(e){ ses.kaydedici=new MediaRecorder(a); }
    if(!ses.tip && ses.kaydedici.mimeType) ses.tip=ses.kaydedici.mimeType;

    ses.kaydedici.ondataavailable=function(ev){ if(ev.data && ev.data.size) ses.parcalar.push(ev.data); };
    ses.kaydedici.onerror=function(){ toast("Kayıt sırasında hata oldu, tekrar dene."); kayitIptal(); };
    ses.kaydedici.onstop=function(){ kayitBitti(); };

    ses.kaydedici.start(250);
    ses.aktif=true; ses.baslangic=Date.now();
    olcumBaslat(a);

    ses.sayac=setInterval(function(){
      var gecen=Math.floor((Date.now()-ses.baslangic)/1000);
      var e=document.getElementById("sesSure");
      if(e) e.textContent=Math.floor(gecen/60)+":"+String(gecen%60).padStart(2,"0");
      if(gecen>=ENCOK_SANIYE){ toast("3 dakika doldu, kayıt durduruldu."); kayitDurdur(); }
    },250);

    ciz();
    return true;
  }).catch(function(e){
    ses.aktif=false;
    toast(izinHatasi(e));
    ciz();
    return false;
  });
}
function izinHatasi(e){
  var ad=(e && e.name)||"";
  if(ad==="NotAllowedError"||ad==="SecurityError")
    return "Mikrofon izni verilmedi. Pencerenin üstünde çıkan kutudan 'İzin ver' de.";
  if(ad==="NotFoundError"||ad==="OverconstrainedError")
    return "Seçili mikrofon bulunamadı. Ayarlar'dan başka bir mikrofon seç.";
  if(ad==="NotReadableError")
    return "Mikrofona ulaşılamıyor; başka bir program kullanıyor olabilir.";
  return "Mikrofon açılamadı: "+((e&&e.message)||ad||"bilinmeyen hata");
}
function kayitDurdur(){
  if(!ses.aktif || !ses.kaydedici) return;
  try{ ses.kaydedici.stop(); }catch(e){ kayitBitti(); }
}
function kayitIptal(){
  ses.iptal=true;
  if(ses.aktif && ses.kaydedici){ try{ ses.kaydedici.stop(); }catch(e){} }
  else sesKapat();
  ciz();
}
function sesKapat(){
  if(ses.sayac){ clearInterval(ses.sayac); ses.sayac=null; }
  olcumDurdur();
  if(ses.akis){ ses.akis.getTracks().forEach(function(t){ t.stop(); }); ses.akis=null; }
  ses.kaydedici=null; ses.aktif=false; ses.parcalar=[];
}

function kayitBitti(){
  var parcalar=ses.parcalar.slice();
  var tip=ses.tip||"audio/webm";
  var amac=ses.amac, hedef=ses.hedef, iptal=ses.iptal;
  // Ölçüm hiç yapılamadıysa sessizlik uyarısı verme (yanlış alarm olur).
  var tepe = ses.olcumSayisi>8 ? ses.enYuksek : -1;
  sesKapat();
  if(iptal){ ciz(); return; }

  if(!parcalar.length){ toast("Ses kaydedilemedi. Mikrofonu Ayarlar'dan dene."); ciz(); return; }
  var blob=new Blob(parcalar,{type:tip});
  if(blob.size<1200){ toast("Kayıt çok kısa. Butona basılı tutup konuş."); ciz(); return; }
  if(tepe>=0 && tepe<4){ toast("Mikrofondan ses gelmemiş görünüyor; yine de gönderiliyor."); }

  sesIsleniyor(amac, true);
  blobB64(blob).then(function(b64){
    return window.zeka.dinle({ ses:b64, tip:tip, amac:(amac==="form"?"form":"metin"), baglam:sesBaglami(amac) });
  }).then(function(r){
    sesIsleniyor(amac, false);
    if(!(r && r.ok)){ sesHatasi((r&&r.hata)||"bilinmeyen hata", amac); return; }
    sesSonucIsle(amac, hedef, r);
  }).catch(function(e){
    sesIsleniyor(amac, false);
    sesHatasi(e.message, amac);
  });
}
function blobB64(blob){
  return new Promise(function(coz, red){
    var o=new FileReader();
    o.onload=function(){
      var s=String(o.result);
      var v=s.indexOf(",");
      coz(v>=0 ? s.slice(v+1) : s);
    };
    o.onerror=function(){ red(new Error("Ses okunamadı")); };
    o.readAsDataURL(blob);
  });
}
function sesBaglami(amac){
  if(amac!=="form") return "";
  var s=["BUGÜNÜN TARİHİ: "+bugun()];
  if(veri.musteriler.length){
    s.push("MEVCUT MÜŞTERİLER (hesap bağlantısı için id eşleştir):");
    veri.musteriler.slice(0,300).forEach(function(m){
      s.push("  id="+m.id+" | "+m.ad+(m.koy?" | "+m.koy:""));
    });
  } else s.push("Kayıtlı müşteri yok.");
  return s.join("\n");
}
function sesIsleniyor(amac, durum){
  gorunum.sesIsliyor = durum ? (amac||true) : null;
  ciz();
}
function sesHatasi(h, amac){
  gorunum.sesHata=h;
  ciz();
  toast("Ses çözümlenemedi");
}

function sesSonucIsle(amac, hedef, r){
  gorunum.sesHata="";
  if(amac==="soru"){
    gorunum.soru=r.metin;
    gorunum.ad="soru";
    ciz();
    var k=document.getElementById("soruKutu");
    if(k) k.value=r.metin;
    sor();
    return;
  }
  if(amac==="not"){
    gorunum.sesMetin=r.metin;
    ciz();
    var t=document.getElementById(hedef||"yeniNot");
    if(t){ t.value=(t.value?t.value.replace(/\s*$/,"")+" ":"")+r.metin; t.focus(); }
    toast("Yazıya çevrildi, kontrol et");
    return;
  }
  if(amac==="form"){
    gorunum.sesForm={ metin:r.metin, veri:r.veri||null, supheli:[] };
    formaYaz(r.veri||{}, r.metin);
    return;
  }
}

/* ---- konuşmadan gelen alanları forma yazar (ASLA kendiliğinden kaydetmez) ---- */
function sayiAyikla(d){
  if(d===null||d===undefined||d==="") return "";
  if(typeof d==="number") return isFinite(d)?String(d):"";
  var s=String(d).replace(/[^\d.,-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",",".");
  var n=parseFloat(s);
  return isFinite(n)?String(n):"";
}
function tarihAyikla(d){
  if(!d) return "";
  var s=String(d).trim();
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : "";
}
function listeIcinde(d, secenekler){
  if(!d) return "";
  var n=norm(d);
  for(var i=0;i<secenekler.length;i++) if(norm(secenekler[i])===n) return secenekler[i];
  return "";
}
function formaYaz(v, metin){
  gorunum.ad="yeni"; gorunum.mod="yeni";
  var supheli=[];
  if(v && Object.prototype.toString.call(v.supheli)==="[object Array]"){
    v.supheli.forEach(function(x){ supheli.push(String(x)); });
  }
  gorunum.sesForm={ metin:metin, supheli:supheli };
  ciz();

  function koy(kimlik, deger){
    var e=document.getElementById(kimlik);
    if(!e || deger===""||deger===null||deger===undefined) return;
    e.value=deger;
    e.dataset.sesle="1";
  }
  koy("f_ad", v.ad||"");
  koy("f_tel", v.tel||"");
  koy("f_koy", v.koy||"");
  koy("f_arazi", v.arazi||"");
  koy("f_urun", v.urun||"");
  koy("f_miktar", v.miktar||"");
  koy("f_tarih", tarihAyikla(v.tarih));
  koy("f_tutar", sayiAyikla(v.tutar));
  koy("f_odenen", sayiAyikla(v.odenen));
  koy("f_yontem", listeIcinde(v.yontem, ["Nakit","Havale / EFT","Kredi kartı","Çek","Senet"]));
  koy("f_odtarih", tarihAyikla(v.odemeTarihi));
  koy("f_vade", tarihAyikla(v.vade));
  koy("f_vadenot", v.vadeNot||"");
  koy("f_iliski", listeIcinde(v.iliski, ["Babası","Oğlu","Kardeşi","Eşi","Ortağı","Kiracısı","Akrabası"]));
  koy("f_not", v.not||"");

  // hesap sahibi: önce id, olmazsa ada göre eşleştir
  var hid="";
  if(v.hesapSahibiId && msAl(String(v.hesapSahibiId))) hid=String(v.hesapSahibiId);
  else if(v.hesapSahibiAd){
    var ad=norm(v.hesapSahibiAd), bul=null;
    veri.musteriler.forEach(function(m){ if(norm(m.ad)===ad) bul=m; });
    if(!bul) veri.musteriler.forEach(function(m){ if(norm(m.ad).indexOf(ad)>=0 && ad.length>3) bul=m; });
    if(bul) hid=bul.id;
  }
  if(hid) koy("f_hesap", hid);
  else if(v.hesapSahibiAd && supheli.indexOf("hesapSahibi")<0) supheli.push("hesapSahibi");

  // tamamı ödendi mi?
  var tutar=parseFloat(sayiAyikla(v.tutar))||0, odenen=parseFloat(sayiAyikla(v.odenen))||0;
  if(tutar>0 && odenen>=tutar){
    var r1=document.querySelector('input[name="oddurum"][value="tam"]');
    if(r1){ r1.checked=true; document.querySelectorAll(".rad").forEach(function(x){ x.classList.toggle("on", x.dataset.od==="tam"); }); }
  }

  // şüpheli alanları işaretle
  var es={ ad:"f_ad", tel:"f_tel", koy:"f_koy", arazi:"f_arazi", urun:"f_urun", miktar:"f_miktar",
    tarih:"f_tarih", tutar:"f_tutar", odenen:"f_odenen", yontem:"f_yontem", odemeTarihi:"f_odtarih",
    vade:"f_vade", vadeNot:"f_vadenot", iliski:"f_iliski", not:"f_not", hesapSahibi:"f_hesap", hesapSahibiAd:"f_hesap" };
  supheli.forEach(function(k){
    var e=document.getElementById(es[k]||"");
    if(e) e.classList.add("supheli");
  });
  gorunum.sesForm.supheli=supheli;

  var ilk=document.getElementById("f_ad");
  if(ilk) ilk.focus();
  toast("Forma yazıldı — kaydetmeden önce kontrol et");
}


/* ============================================================
   FOTOĞRAFTAN AKTARMA — defter sayfasını okuyup kayda geçirir.
   Hiçbir şey kendiliğinden kaydedilmez: önce kontrol ekranı.
   ============================================================ */
var YONTEMLER=["Nakit","Havale / EFT","Kredi kartı","Çek","Senet"];

function fotoSifirla(){ gorunum.foto={ durum:"bos" }; }

/* Fotoğrafı küçültüp JPEG'e çevirir; telefon fotoğrafındaki dönüklüğü düzeltir. */
function fotoHazirla(dosya){
  return new Promise(function(coz, red){
    if(!dosya || !/^image\//.test(dosya.type||"") && !/\.(heic|heif|jpe?g|png|webp)$/i.test(dosya.name||"")){
      red(new Error("Bu bir fotoğraf dosyası değil.")); return;
    }
    if(dosya.size>30*1024*1024){ red(new Error("Fotoğraf çok büyük (30 MB üstü).")); return; }
    function hamGonder(){
      var r=new FileReader();
      r.onload=function(){ var t=String(r.result); coz({ b64:t.slice(t.indexOf(",")+1), tip:dosya.type||"image/heic", onizleme:"" }); };
      r.onerror=function(){ red(new Error("Fotoğraf okunamadı.")); };
      r.readAsDataURL(dosya);
    }
    var ac = window.createImageBitmap ? createImageBitmap(dosya,{ imageOrientation:"from-image" }) : Promise.reject(new Error("yok"));
    ac.then(function(bm){
      function ciz(enBuyuk, kalite){
        var o=Math.min(1, enBuyuk/Math.max(bm.width,bm.height));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(bm.width*o)); c.height=Math.max(1,Math.round(bm.height*o));
        c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
        return c.toDataURL("image/jpeg", kalite);
      }
      var buyuk=ciz(1600,0.85), kucuk=ciz(420,0.7);
      if(bm.close) bm.close();
      coz({ b64:buyuk.slice(buyuk.indexOf(",")+1), tip:"image/jpeg", onizleme:kucuk });
    }).catch(function(){
      // Chrome iPhone'un HEIC biçimini açamaz; Gemini açabildiği için olduğu gibi gönder.
      if(/heic|heif/i.test((dosya.type||"")+(dosya.name||"")) && dosya.size<12*1024*1024) hamGonder();
      else red(new Error("Bu fotoğraf açılamadı. WhatsApp'tan gönderip oradan kopyalamayı dene."));
    });
  });
}

function fotoBaslat(dosya){
  if(!window.zeka){ toast("Bu pencerede fotoğraf okunamıyor."); return; }
  if(!ayar.anahtarVar){ gorunum.ad="foto"; gorunum.foto={ durum:"bos", hata:"Fotoğraf okumak için önce Ayarlar'dan Gemini anahtarını gir." }; ciz(); return; }
  gorunum.ad="foto";
  var no = (window.__fotoNo = (window.__fotoNo||0) + 1);   // eski okumaların cevabını yok saymak için
  gorunum.foto={ durum:"okunuyor", no:no, basla:Date.now() }; ciz();
  clearInterval(window.__fotoSaat);
  window.__fotoSaat=setInterval(function(){
    var f=gorunum.foto, el=document.getElementById("fotoSure");
    if(!f || f.no!==no || f.durum!=="okunuyor"){ clearInterval(window.__fotoSaat); return; }
    if(el) el.textContent=Math.round((Date.now()-f.basla)/1000)+" sn";
  },1000);
  fotoHazirla(dosya).then(function(h){
    if(!gorunum.foto || gorunum.foto.no!==no) return null;
    gorunum.foto.onizleme=h.onizleme; ciz();
    window.__fotoBoyut=Math.round(h.b64.length*3/4/1024);
    return window.zeka.gor({ resim:h.b64, tip:h.tip, bugun:bugun() });
  }).then(function(r){
    if(!gorunum.foto || gorunum.foto.no!==no || gorunum.foto.durum!=="okunuyor") return;
    if(!(r && r.ok)){ gorunum.foto={ durum:"bos", hata:(r&&r.hata)||"Fotoğraf okunamadı." }; ciz(); return; }
    fotoSonucuKur(r.veri||{}, gorunum.foto.onizleme);
    ciz();
  }).catch(function(e){
    if(!gorunum.foto || gorunum.foto.no!==no) return;
    gorunum.foto={ durum:"bos", hata:e.message }; ciz();
  });
}

function fotoTarih(t){
  t=String(t||"").trim();
  var m=t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m){
    var k=t.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?$/);
    if(!k) return "";
    var y=k[3]?(k[3].length===2?"20"+k[3]:k[3]):bugun().slice(0,4);
    t=y+"-"+String(k[2]).padStart(2,"0")+"-"+String(k[1]).padStart(2,"0");
  }
  // Gelecekte bir tarih çıktıysa yılı yanlış verilmiştir: bir yıl geri al.
  if(t>bugun()) t=(Number(t.slice(0,4))-1)+t.slice(4);
  return t;
}
function fotoSayi(v){ var n=parseFloat(sayiAyikla(v)); return isFinite(n)?n:0; }

function fotoSonucuKur(v, onizleme){
  var mu=v.musteri||{}, sup={};
  (Object.prototype.toString.call(v.supheli)==="[object Array]"?v.supheli:[]).forEach(function(x){ sup[String(x)]=1; });
  var satirlar=(Object.prototype.toString.call(v.satirlar)==="[object Array]"?v.satirlar:[]).map(function(r,i){
    var tur=(String(r.tur||"").toLowerCase().indexOf("tah")===0)?"tahsilat":"satis";
    var s={ sec:true, tur:tur, tarih:fotoTarih(r.tarih), urun:String(r.urun||"").trim(),
            miktar:String(r.miktar||"").trim(), tutar:fotoSayi(r.tutar),
            yontem:listeIcinde(r.yontem, YONTEMLER), bakiye:(r.bakiye===null||r.bakiye===undefined||r.bakiye==="")?null:fotoSayi(r.bakiye),
            sup:{} };
    ["tarih","urun","miktar","tutar","yontem"].forEach(function(a){ if(sup["satir"+(i+1)+"."+a]) s.sup[a]=1; });
    return s;
  }).filter(function(s){ return s.tutar>0 || s.urun; });

  var f={ durum:"hazir", onizleme:onizleme||"",
    m:{ ad:String(mu.ad||"").trim(), tc:tcTemizle(mu.tc), tel:String(mu.tel||"").trim(), koy:String(mu.koy||"").trim(), not:String(mu.not||"").trim() },
    supM:{ ad:!!sup.ad, tc:!!sup.tc, tel:!!sup.tel, koy:!!sup.koy },
    sayfaNo:String(v.sayfaNo||"").trim(),
    sonBakiye:(v.sonBakiye===null||v.sonBakiye===undefined||v.sonBakiye==="")?null:fotoSayi(v.sonBakiye),
    satirlar:satirlar, hedef:"" };
  // Kayıtlı müşteriyi bul: önce TC, sonra ad.
  var es=null;
  if(f.m.tc && tcGecerli(f.m.tc)) es=tcSahibi(f.m.tc,null);
  if(!es && f.m.ad){ var n=norm(f.m.ad); es=veri.musteriler.filter(function(x){ return norm(x.ad)===n; })[0]||null; }
  f.hedef = es ? es.id : "";
  gorunum.foto=f;
  fotoMukerrerIsaretle();
}

/* Kayıtlı müşteriye aktarılırken aynı satır zaten varsa işaretle, seçimini kaldır. */
function fotoMukerrerIsaretle(){
  var f=gorunum.foto; if(!f||!f.satirlar) return;
  f.satirlar.forEach(function(s){
    var onceki=s.var; s.var=false;
    if(!f.hedef){ if(onceki) s.sec=true; return; }
    if(s.tur==="satis") s.var=veri.satislar.some(function(x){ return x.musteriId===f.hedef && x.tarih===s.tarih && Number(x.tutar)===Number(s.tutar); });
    else s.var=veri.odemeler.some(function(x){ return x.musteriId===f.hedef && x.tarih===s.tarih && Number(x.tutar)===Number(s.tutar); });
    if(s.var) s.sec=false; else if(onceki) s.sec=true;
  });
}

/* Defterdeki bakiye ile okunan rakamları karşılaştır: yanlış okunan satırı yakalar. */
function fotoBakiye(){
  var f=gorunum.foto, yuruyen=0, ilkHata=-1;
  f.satirlar.forEach(function(s,i){
    yuruyen += (s.tur==="satis"?1:-1)*(Number(s.tutar)||0);
    s.hesap=yuruyen;
    s.bakiyeHata = (s.bakiye!==null && Math.abs(s.bakiye-yuruyen)>0.5);
    if(s.bakiyeHata && ilkHata<0) ilkHata=i;
  });
  var tutuyor = f.sonBakiye===null ? null : Math.abs(f.sonBakiye-yuruyen)<=0.5;
  return { hesap:yuruyen, tutuyor:tutuyor, ilkHata:ilkHata };
}

  if(b.tutuyor && b.ilkHata<0)
    return '<div class="ozet"><b>✓ Bakiye tutuyor.</b> Defterde '+para(f.sonBakiye)+', okunan rakamlardan hesaplanan '+para(b.hesap)+'. Rakamlar doğru okunmuş görünüyor.</div>';
  return '<div class="uyari"><b>✗ Bakiye tutmuyor.</b> Defterde '+para(f.sonBakiye)+', okunanlardan hesaplanan '+para(b.hesap)+
    ' (fark '+para(Math.abs((f.sonBakiye||0)-b.hesap))+').'+

}

    ? '<span style="color:var(--red);font-weight:700" title="Defterde '+para(s.bakiye)+' yazıyor">'+h+' ✗</span><div style="color:var(--red)">defter: '+para(s.bakiye)+'</div>'
    : '<span style="color:var(--green);font-weight:700">'+h+' ✓</span>';
}

/* Kontrol ekranında yazdıkça durumu güncelle (sayfayı yeniden çizmeden). */
function fotoAlanDegisti(el){
  var f=gorunum.foto; if(!f||f.durum!=="hazir") return;
  if(el.dataset.fm){
    var a=el.dataset.fm, v=el.value;
    if(a==="tc"){ v=tcTemizle(v).slice(0,11); if(el.value!==v) el.value=v; var d=document.getElementById("fm_tc_durum"); if(d) d.innerHTML=tcDurumHTML(v); }
    f.m[a]=v; el.classList.remove("supheli"); f.supM[a]=false;
    return;
  }
  var p=String(el.dataset.fs).split("."), i=Number(p[0]), a2=p[1], s=f.satirlar[i]; if(!s) return;
  if(a2==="sec") s.sec=el.checked;
  else if(a2==="tutar") s.tutar=fotoSayi(el.value);
  else s[a2]=el.value;
  if(a2!=="sec"){ el.classList.remove("supheli"); s.sup[a2]=0; }
  if(a2==="tur"){ fotoMukerrerIsaretle(); ciz(); return; }
  if(a2==="tarih"||a2==="tutar"){ var onceki=s.var; fotoMukerrerIsaretle(); if(onceki!==s.var){ ciz(); return; } }
  fotoBakiye();
  f.satirlar.forEach(function(x,k){ var c=document.getElementById("fb_"+k); if(c) c.innerHTML=fotoSatirBakiye(x); });
  var bk=document.getElementById("fotoBakiyeKutu"); if(bk) bk.innerHTML=fotoBakiyeHTML();
  var say=document.getElementById("fotoSecSay"); if(say) say.textContent=f.satirlar.filter(function(x){ return x.sec; }).length;
}

function fotoKaydet(){
  var f=gorunum.foto; if(!f||f.durum!=="hazir") return;
  var sec=f.satirlar.filter(function(s){ return s.sec; });
  if(!f.hedef && !String(f.m.ad).trim()){ toast("Müşterinin adını yaz"); var e=document.getElementById("fm_ad"); if(e) e.focus(); return; }
  for(var i=0;i<sec.length;i++){
    var s=sec[i], no=f.satirlar.indexOf(s)+1;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s.tarih)){ toast(no+". satırın tarihi eksik"); return; }
    if(!(Number(s.tutar)>0)){ toast(no+". satırın tutarı eksik"); return; }
    if(s.tur==="satis" && !String(s.urun).trim()){ toast(no+". satırın ürünü eksik"); return; }
  }
  var b=fotoBakiye();
  if(b.tutuyor===false && !confirm("Bakiye defterle tutmuyor (defter "+para(f.sonBakiye)+", hesaplanan "+para(b.hesap)+").\n\nYine de kaydedilsin mi?")) return;
  if(!sec.length && f.hedef){
    // Kayıtlı müşteri, eklenecek satır yok: hiçbir şeye dokunma.
    var adx=(msAl(f.hedef)||{}).ad||"";
    gorunum.foto={ durum:"bos", basari:'Bu sayfadaki bütün satırlar <b>'+esc(adx)+'</b> hesabında zaten kayıtlı, eklenecek bir şey yok. Sıradaki sayfanın fotoğrafını bırakabilirsin.' };
    ciz(); return;
  }
  if(!sec.length && !confirm("Kaydedilecek satır seçili değil. Sadece müşteri bilgileri kaydedilsin mi?")) return;

  var m;
  var tc=tcTemizle(f.m.tc);
  if(f.hedef){
    m=msAl(f.hedef);
    // boş olan bilgileri tamamla, dolu olana dokunma
    if(!m.tc && tc){ if(!tcOnayla(tc,m.id)) return; m.tc=tc; }
    if(!m.tel && f.m.tel) m.tel=f.m.tel;
    if(!m.koy && f.m.koy) m.koy=f.m.koy;
  } else {
    if(tc && !tcOnayla(tc,null)) return;
    m={ id:id(), ad:String(f.m.ad).trim(), tel:f.m.tel, tc:tc, koy:f.m.koy, arazi:"", hesapSahibiId:null, iliski:"", notlar:[] };
    veri.musteriler.push(m);
  }
  var vadeli = /vade/i.test(f.m.not||"");
  sec.forEach(function(s){
    if(s.tur==="satis") veri.satislar.push({ id:id(), musteriId:m.id, urun:String(s.urun).trim(), miktar:String(s.miktar||"").trim(),
                                            tarih:s.tarih, tutar:Number(s.tutar), vade:"", vadeNot:vadeli?"Vadeli":"" });
    else veri.odemeler.push({ id:id(), musteriId:m.id, tutar:Number(s.tutar), tarih:s.tarih, yontem:s.yontem||"", not:"Defterden aktarıldı" });
  });
  m.notlar=m.notlar||[];
  if(sec.length) m.notlar.push({ id:id(), tarih:bugun(), metin:"Defter"+(f.sayfaNo?" No "+f.sayfaNo:"")+" fotoğraftan aktarıldı ("+sec.length+" satır)."+(f.m.not?" Kart notu: "+f.m.not+".":"") });
  kaydet();
  var ad=m.ad, mid=m.id;
  gorunum.foto={ durum:"bos", basari:'<b>'+esc(ad)+'</b> kaydedildi — '+sec.length+' satır eklendi, kalan borç <b>'+para(borc(mid))+'</b>. '+
    '<button class="btn3" data-ms="'+mid+'">Kartı aç</button> · Sıradaki sayfanın fotoğrafını bırakabilirsin.' };
  ciz();
}

  var e=document.getElementById("ekran");
  if(gorunum.ad==="panel") e.innerHTML=panelHTML();
  else if(gorunum.ad==="musteriler") e.innerHTML=listeHTML();

function git(ad,mid){

  if(ad==="foto" && gorunum.foto && gorunum.foto.durum==="bos"){ gorunum.foto.basari=""; gorunum.foto.hata=""; }
  gorunum.ad=ad; if(mid!==undefined) gorunum.musteriId=mid; ciz();
