<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com https://0.peerjs.com wss://0.peerjs.com">
<title>MacarZeka — Müşteri Takibi</title>

<!-- Telefonda "Ana Ekrana Ekle" dendiğinde uygulama gibi açılsın -->
<meta name="theme-color" content="#13251D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MacarZeka">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#F7F5EF; --card:#FFFFFF; --ink:#16211B; --muted:#566159;
    --line:#E6E1D4; --line2:#EDE8DB; --green:#1F5D45; --green-soft:#E7EFE8;
    --green-line:#CFE0D6; --dark:#13251D; --dark2:#214536; --dark-ink:#C9D6CE;
    --dark-mut:#8FA79A; --red:#8A3F12; --red-soft:#F7E6DA; --red-bg:#FDF6F1;
    --red-line:#EBD6C6; --warn:#4A4320; --warn-soft:#F0EBD5; --field:#DDD7C8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--field);border-radius:11px;padding:11px 13px;width:100%;min-height:44px}
  textarea{min-height:84px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
  .app{display:flex;height:100vh}
  .side{flex:0 0 240px;background:var(--dark);color:var(--dark-ink);padding:22px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .brand .mark{width:36px;height:36px;border-radius:11px;background:#2E7D5B;display:flex;align-items:center;justify-content:center;flex:none}
  .brand b{display:block;color:#fff;font-size:18px;letter-spacing:-.2px}
  .brand span{display:block;font-size:11px;color:var(--dark-mut)}
  .nav{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;background:none;border:none;color:var(--dark-ink);font-size:15px;min-height:44px;width:100%;text-align:left}
  .nav:hover{background:#1b3a2d;color:#fff}
  .nav.on{background:var(--dark2);color:#fff;font-weight:600}
  .side-foot{margin-top:auto;border-top:1px solid #1E3A2E;padding-top:12px;display:flex;flex-direction:column;gap:7px}
  .kayit-durum{font-size:12px;color:var(--dark-mut);padding:0 8px 4px;line-height:1.5;word-break:break-word}
  .mini{background:#1b3a2d;border:none;color:var(--dark-ink);border-radius:9px;padding:9px 10px;font-size:13px;min-height:38px;text-align:left}
  .mini:hover{background:var(--dark2);color:#fff}
  .main{flex:1 1 auto;min-width:0;padding:24px 30px 40px;overflow-y:auto}
  h1{font-size:27px;letter-spacing:-.4px;margin:0}
  .sub{font-size:14px;color:var(--muted);margin-top:3px}
  .head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--green);color:#fff;border:none;border-radius:11px;padding:0 18px;min-height:44px;font-size:15px;font-weight:600}
  .btn:hover{background:#174a37}
  .btn2{background:#fff;color:var(--ink);border:1px solid var(--field)}
  .btn2:hover{background:#f1eee4}
  .btn3{background:none;border:none;color:var(--green);font-weight:600;font-size:14px;padding:6px 2px;min-height:auto}
  .btn-dan{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red)}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}
  .card .k{font-size:13px;color:var(--muted)}
  .card .v{font-size:27px;margin-top:5px;font-weight:600;letter-spacing:-.5px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .box-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line2);font-size:16px;font-weight:700}
  .box-p{padding:18px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);background:#FAF8F2;padding:11px 16px;font-weight:600;white-space:nowrap}
  td{padding:13px 16px;border-top:1px solid var(--line2);vertical-align:middle}
  tbody tr:hover{background:#FAF8F2}
  .rowlink{font-weight:600;color:var(--green);background:none;border:none;padding:0;font-size:14px;text-align:left}
  .rowlink:hover{text-decoration:underline}
  .r{text-align:right}
  .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;white-space:nowrap}
  .t-ok{color:var(--green);background:var(--green-soft)}
  .t-borc{color:var(--red);background:var(--red-soft)}
  .t-vade{color:var(--warn);background:var(--warn-soft)}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .col-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .col-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .pill{min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--field);background:#fff;font-size:14px;font-weight:600}
  .pill.on{background:var(--green-soft);border:1.5px solid var(--green)}
  .rad{display:inline-flex;align-items:center;gap:8px;min-height:44px;margin:0;padding:0 15px;background:#fff;border:1px solid var(--field);border-radius:11px;font-size:14px;font-weight:600;color:var(--ink)}
  .rad.on{background:var(--green-soft);border:1.5px solid var(--green)}
  .rad input{width:17px;height:17px;min-height:0;padding:0;accent-color:var(--green)}
  .ozet{background:var(--green-soft);border:1px solid var(--green-line);border-radius:14px;padding:16px 18px;font-size:16px;line-height:1.6}
  .uyari{background:var(--red-bg);border:1px solid var(--red-line);border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.55;color:var(--ink)}
  .ava{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
  .sect{font-size:12px;font-weight:700;letter-spacing:1.1px;color:var(--green);margin-bottom:13px}
  .lbl{font-size:12px;font-weight:700;letter-spacing:1.1px;color:var(--muted);margin:0 0 11px}
  .liste-sat{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .bos{text-align:center;padding:50px 20px;color:var(--muted)}
  .bos h3{color:var(--ink);font-size:18px;margin:0 0 7px}
  .notkart{background:#FAF8F2;border-radius:12px;padding:13px;font-size:14px;line-height:1.55}
  .notkart .d{font-size:12px;color:var(--muted);margin-top:6px}
  .chip{min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--field);background:#fff;font-size:13.5px}
  .chip:hover{background:#f1eee4}
  .kaynak{display:inline-flex;align-items:center;gap:7px;background:#F2EFE5;border:none;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:13px 20px;border-radius:12px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:90;max-width:90vw}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .yaz{display:flex;gap:10px;margin-bottom:12px}
  .yaz input{min-height:52px;font-size:16px;border:1.5px solid var(--green);border-radius:13px}
  .yaz button{min-height:52px;padding:0 24px;border-radius:13px;border:none;background:var(--green);color:#fff;font-size:16px;font-weight:600;flex:none}
  /* ---- ses ---- */
  .mikbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 20px;border-radius:13px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-size:15px;font-weight:600;flex:none}
  .mikbtn:hover{background:var(--green-soft)}
  .mikbtn.kayitta{background:var(--red);border-color:var(--red);color:#fff;animation:nabiz 1.6s ease-in-out infinite}
  .mikbtn:disabled{opacity:.45;cursor:not-allowed}
  @keyframes nabiz{0%,100%{box-shadow:0 0 0 0 rgba(138,63,18,.45)}50%{box-shadow:0 0 0 9px rgba(138,63,18,0)}}
  .seviye{display:flex;align-items:center;gap:3px;height:34px}
  .seviye i{display:block;width:5px;border-radius:3px;background:var(--line);height:6px;transition:height .07s linear,background .07s linear}
  .seviye i.on{background:var(--green)}
  .seviye i.yuksek{background:var(--red)}
  .seskutu{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .sesbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .sure{font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;min-width:62px}
  .dalga{flex:1 1 180px;min-width:120px;height:34px;display:flex;align-items:center;gap:2px;overflow:hidden}
  .dalga i{display:block;flex:1 1 auto;min-width:2px;max-width:5px;border-radius:2px;background:var(--green-line);height:4px}
  .supheli{border-color:var(--red)!important;background:var(--red-bg)!important}
  .rozet-supheli{display:inline-block;font-size:11px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:999px;padding:3px 8px;margin-left:7px}
  .duyulan{background:#FAF8F2;border:1px solid var(--line2);border-radius:12px;padding:14px;font-size:15px;line-height:1.6}
  @media (max-width:1150px){ .cards{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:900px){ .grid2,.grid3{grid-template-columns:1fr} }

  /* ---- telefon: yan menü alta iner, uygulama gibi dursun ---- */
  @media (max-width:760px){
    .app{flex-direction:column;height:auto;min-height:100vh;min-height:100dvh}
    .side{
      position:fixed;left:0;right:0;bottom:0;z-index:70;
      flex:none;flex-direction:row;gap:0;overflow:visible;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      border-top:1px solid #1E3A2E;
    }
    .side .brand,.side .side-foot{display:none}
    .nav{
      flex:1 1 0;min-width:0;flex-direction:column;gap:3px;
      padding:7px 2px;min-height:54px;font-size:11px;font-weight:600;
      text-align:center;align-items:center;justify-content:center;border-radius:12px;
    }
    .nav svg{width:21px;height:21px;flex:none}
    .nav.on{background:var(--dark2)}
    .main{
      flex:1 1 auto;overflow:visible;
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom));
    }
    body{overflow:auto}
    h1{font-size:23px}
    .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .card{padding:14px}
    .card .v{font-size:22px}
    .box-p{padding:15px}
    .head{gap:11px;margin-bottom:16px}
    .cols{gap:15px}
    .col-main,.col-side{flex:1 1 100%}
    th,td{padding:11px 12px}
    .yaz{flex-wrap:wrap}
    .yaz input{flex:1 1 100%}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
    /* iOS: yazı alanına dokununca sayfayı yakınlaştırmasın */
    input,select,textarea{font-size:16px}
  }
  @media (max-width:420px){
    .cards{grid-template-columns:1fr}
    .nav{font-size:10px}
  }
  @media print{ .side{display:none} body{overflow:visible} .main{overflow:visible} }
  /* ============================================================
     Liquid Glass katmanı — renk/yerleşim üstteki temeli ezer.
     Yazdırma ve işlevler etkilenmez.
     ============================================================ */
  :root{
    --bg:#edf3ee; --card:rgba(255,255,255,.62); --line:rgba(20,60,38,.09); --line2:rgba(20,60,38,.07);
    --field:rgba(20,60,38,.12); --ink:#14201a; --muted:#5d6b63;
    --cam:rgba(255,255,255,.58); --cam-kenar:rgba(255,255,255,.78);
    --cam-golge:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px -10px rgba(18,60,36,.16),0 2px 6px rgba(18,60,36,.05);
    --bulanik:blur(22px) saturate(170%);
  }
  body{
    background:
      radial-gradient(900px 600px at 8% -8%,#c6e6d2 0%,transparent 60%),
      radial-gradient(800px 560px at 102% 4%,#e3efcf 0%,transparent 58%),
      radial-gradient(900px 700px at 55% 112%,#cfe7e0 0%,transparent 62%),
      #edf3ee;
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .ik{width:18px;height:18px;flex:none;vertical-align:-3px}

  /* yan menü: yüzen cam panel */
  .app{padding:12px;gap:12px;height:100vh}
  .side{
    background:var(--cam);color:var(--ink);border:1px solid var(--cam-kenar);border-radius:26px;
    box-shadow:var(--cam-golge);-webkit-backdrop-filter:var(--bulanik);backdrop-filter:var(--bulanik);
    padding:18px 12px;flex-basis:232px;
  }
  .brand{padding:0 8px 20px}
  .brand .mark{background:linear-gradient(160deg,#2c8550,#1f5d45);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 14px -6px rgba(31,93,69,.7);border-radius:12px}
  .brand b{color:var(--ink)}
  .brand span{color:var(--muted)}
  .nav{color:var(--muted);border-radius:14px;font-weight:600;transition:background .2s,color .2s,box-shadow .2s}
  .nav:hover{background:rgba(255,255,255,.55);color:var(--ink)}
  .nav.on{background:rgba(255,255,255,.95);color:var(--green);box-shadow:0 1px 0 #fff inset,0 4px 14px -5px rgba(18,60,36,.28)}
  .side-foot{border-top:1px solid rgba(20,60,38,.08)}
  .kayit-durum{color:var(--muted)}
  .kayit-durum .ik{width:15px;height:15px;color:var(--green);margin-right:4px;vertical-align:-3px}
  .kayit-durum b .ik{color:var(--red)}
  .mini{display:flex;align-items:center;gap:9px;background:transparent;color:var(--ink);border-radius:12px;font-weight:600}
  .mini .ik{width:17px;height:17px;color:var(--green)}
  .mini:hover{background:rgba(255,255,255,.65);color:var(--ink)}

  .main{padding:16px 22px 40px}
  h1{font-weight:700;letter-spacing:-.5px}

  /* butonlar: hap */
  .btn{border-radius:999px;background:linear-gradient(180deg,#2c8550,#1f6b3a);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px -7px rgba(31,107,58,.65);transition:transform .12s,background .2s}
  .btn:hover{background:linear-gradient(180deg,#27784a,#185c31)}
  .btn:active{transform:scale(.97)}
  .btn2{background:rgba(255,255,255,.72);color:var(--ink);border:none;box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(20,60,38,.08),0 2px 6px rgba(18,60,36,.06)}
  .btn2:hover{background:rgba(255,255,255,.96)}
  .btn3{display:inline-flex;align-items:center;gap:6px;background:none;box-shadow:none}
  .btn3:hover{background:none;text-decoration:underline}
  .btn-dan{background:rgba(138,63,18,.09);border:none;color:var(--red);box-shadow:none}
  .btn-dan:hover{background:rgba(138,63,18,.15)}

  /* kartlar ve kutular: cam (bulanıklık yalnız menüde; çok kartta eski bilgisayarı yormasın) */
  .card,.box,.seskutu,.liste-sat{
    background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.56));
    border:1px solid var(--cam-kenar);box-shadow:var(--cam-golge)
  }
  .card{border-radius:20px}
  .box,.seskutu{border-radius:22px}
  .liste-sat{border-radius:16px;box-shadow:0 1px 0 #fff inset,0 2px 8px -3px rgba(18,60,36,.1)}
  .card .k{font-weight:600}
  .card .v{font-weight:700}
  .box-h{border-bottom:none;padding:16px 20px 6px;font-size:15.5px}
  .box-p{padding:16px 20px 20px}
  .box[style*="--dark"]{background:linear-gradient(160deg,#2a7451,#1a4b37)!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 14px 30px -12px rgba(26,75,55,.6)!important}
  .box[style*="--dark"] .mini{background:rgba(255,255,255,.14);color:#fff}
  .box[style*="--dark"] .mini .ik{color:#bfe8d0}
  .box[style*="--dark"] .mini:hover{background:rgba(255,255,255,.22)}
  .box[style*="--dark"] [style*="--dark-mut"]{color:#cfe5d8!important}
  [style*="background:var(--dark);display:flex"]{background:linear-gradient(160deg,#2c8550,#1f5d45)!important}
  .card[style*="#FAF8F2"],.notkart,.duyulan{background:rgba(255,255,255,.55)!important;border:1px solid rgba(255,255,255,.8)}

  /* tablo */
  th{background:transparent;font-size:12.5px;border-bottom:1px solid var(--line2)}
  td{border-top:1px solid var(--line2)}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:rgba(255,255,255,.6)}

  /* form alanları */
  input,select,textarea{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:0 1px 2px rgba(18,60,36,.06) inset;transition:box-shadow .15s,background .15s}
  input:focus,select:focus,textarea:focus{outline:none;background:#fff;box-shadow:0 0 0 3px rgba(31,93,69,.22),0 1px 2px rgba(18,60,36,.06) inset}
  .yaz input{border:1px solid rgba(255,255,255,.95);border-radius:999px;padding-left:20px;background:rgba(255,255,255,.85)}
  .yaz button{border-radius:999px;background:linear-gradient(180deg,#2c8550,#1f6b3a);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 16px -7px rgba(31,107,58,.65)}
  .mikbtn{border-radius:999px;border:none;background:rgba(255,255,255,.75);box-shadow:0 1px 0 #fff inset,0 0 0 1.5px rgba(31,93,69,.45)}
  .mikbtn:hover{background:#fff}
  .mikbtn.kayitta{box-shadow:none}

  /* seçim düğmeleri */
  .pill,.rad,.chip{border:none;border-radius:999px;background:rgba(255,255,255,.66);box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(20,60,38,.09)}
  .pill:hover,.chip:hover,.rad:hover{background:rgba(255,255,255,.95)}
  .pill.on,.rad.on{background:rgba(231,239,232,.95);border:none;box-shadow:0 0 0 1.5px var(--green),0 4px 12px -6px rgba(31,93,69,.5)}
  .kaynak{background:rgba(255,255,255,.6);border-radius:999px}
  .tag{border-radius:999px}

  /* bilgi kutuları */
  .ozet{background:linear-gradient(180deg,rgba(231,243,235,.88),rgba(220,238,227,.7));border:1px solid rgba(255,255,255,.85);border-radius:20px;box-shadow:var(--cam-golge)}
  .uyari{background:rgba(253,240,233,.82);border:1px solid rgba(235,214,198,.9);border-radius:16px}
  .ava{border-radius:14px;background:rgba(31,93,69,.1)}

  /* bildirim */
  .toast{background:rgba(24,36,29,.8);-webkit-backdrop-filter:var(--bulanik);backdrop-filter:var(--bulanik);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:12px 22px;font-weight:600}

  /* bulanıklık yoksa / saydamlık kapalıysa okunur kalsın */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .side{background:rgba(255,255,255,.9)} }
  @media (prefers-reduced-transparency:reduce){ .side,.toast{-webkit-backdrop-filter:none;backdrop-filter:none} .side{background:rgba(255,255,255,.95)} }

  /* telefon: alttaki menü yüzen cam hap */
  @media (max-width:760px){
    .app{padding:0;gap:0;height:auto}

  /* ---------------- eşleştirme: kodu giren taraf ---------------- */

      var uyeler = M.grup.uyeler || {};
      var liste = [M.cihaz].concat(digerUyeler());
      h = ust("Bilgisayar eşleştirme", "Bu bilgisayar " + (liste.length - 1) + " bilgisayarla eşleşik.") +
        '<div class="esl-durum ' + (d.renk === "yesil" ? "iyi" : "") + '"><span class="esl-nokta ' + d.renk + '"></span><div><b>' + e(d.yazi) + '</b>' + (d.alt ? '<small>' + e(d.alt) + '</small>' : '') + '</div></div>' +
        '<div class="esl-baslik">Bilgisayarlar</div><div class="esl-cihazlar">' +
        liste.map(function (c) {
          var u = uyeler[c] || { ad: c === M.cihaz ? M.ad : "Bilgisayar" }, ben = c === M.cihaz, b = baglar[c];
          var renk, alt;
          if (ben) { renk = anaDurum === "acik" ? "yesil" : (anaDurum === "baglaniyor" ? "sari" : "kirmizi"); alt = anaDurum === "acik" ? "Çevrimiçi" : (anaDurum === "baglaniyor" ? "Bağlanıyor…" : (anaDurum === "ikinci" ? "Başka pencerede açık" : "İnternet yok")); }
          else if (b && b.dogru) { renk = "yesil"; alt = "Bağlı · " + (b.sonEsitleme ? "eşitlendi " + saatYaz(b.sonEsitleme) : "eşitleniyor"); }
          else if (b) { renk = "sari"; alt = "Bağlanıyor…"; }
          else { renk = ""; alt = "Kapalı" + (u.son ? " · son görülme " + saatYaz(u.son) : ""); }
          return '<div class="esl-cihaz"><div class="pc">' + SVG_PC + '<span class="esl-nokta ' + renk + '"></span></div>' +
            '<div class="bilgi"><b>' + e(ben ? M.ad : u.ad) + (ben ? '<span class="esl-etiket">Bu bilgisayar</span>' : '') + '</b><small>' + e(alt) + '</small></div>' +
            (ben ? '<button class="esl-kucuk" data-esl="adDuzenle">' + ikon("i-kalem") + '</button>'
                 : '<button class="esl-kucuk tehlike" data-esl="cikar" data-c="' + e(c) + '" title="Eşleşmeden çıkar">Çıkar</button>') +
          '</div>';
        }).join("") + '</div>' +
        (window.__eslAdDuzen ? '<div class="esl-ad"><input id="eslAdYeni" maxlength="40" value="' + e(M.ad) + '"><button class="btn" data-esl="adKaydet" style="min-height:40px">Kaydet</button></div>' : '') +
        '<div class="esl-sayilar"><div><b>' + sayac.giden + '</b><small>gönderilen</small></div><div><b>' + sayac.gelen + '</b><small>gelen</small></div><div><b>' + (veri.musteriler || []).length + '</b><small>müşteri</small></div></div>' +
        '<div class="esl-alt" style="justify-content:space-between">' +
          '<button class="btn btn2 btn-dan" data-esl="ayril">Eşleşmeyi kaldır</button>' +
          '<span style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn2" data-esl="kodOlustur">' + ikon("i-arti") + 'Bilgisayar ekle</button>' +
          '<button class="btn" data-esl="simdiEsitle">' + ikon("i-tekrar") + 'Şimdi eşitle</button></span>' +
        '</div>';
    }

    p.innerHTML = '<div class="esl-pencere">' + h + '</div>';
    if (pencereGorunum === "gir") {
      var ilk = p.querySelector('[data-esl-hane="0"]');
      if (girisDeger) p.querySelectorAll(".esl-giris input").forEach(function (i, n) { i.value = girisDeger[n] || ""; });
      if (adDeger != null) { var ai2 = p.querySelector("#eslAdGir"); if (ai2) ai2.value = adDeger; }
      if (modDeger) { var mi2 = p.querySelector('input[name="eslMod"][value="' + modDeger + '"]'); if (mi2) mi2.checked = true; }
      if (ilk) setTimeout(function () { ilk.focus(); }, 30);
      girisDenetle();
    }
    if (window.__eslAdDuzen) { var ay = p.querySelector("#eslAdYeni"); if (ay) setTimeout(function () { ay.focus(); ay.select(); }, 30); }
  }
  function girisKodu() {
    var p = document.getElementById("eslPerde"); if (!p) return "";
    return Array.prototype.map.call(p.querySelectorAll(".esl-giris input"), function (i) { return i.value; }).join("");
  }
  function girisDenetle() {
    var bt = document.getElementById("eslGirBtn"); if (!bt) return;
    var tamam = /^\d{6}$/.test(girisKodu());
    bt.disabled = !tamam; bt.style.opacity = tamam ? "" : ".5";
  }

  /* ---------------- olaylar ---------------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-esl]") : null;
    if (!t) return;
    var a = t.dataset.esl;
    if (a === "ac") { pencereAc(M && M.grup ? "yonet" : "ana"); }
    else if (a === "kapat") pencereKapat();
    else if (a === "kodOlustur") { window.__eslAdDuzen = false; kodBaslat(); }
    else if (a === "kodGirEkrani") { eslemeKapat(); pencereGorunum = "gir"; var p = document.getElementById("eslPerde"); if (p) p.innerHTML = ""; pencereCiz(true); }
    else if (a === "geri" || a === "vazgec") { eslemeKapat(); pencereGorunum = M && M.grup ? "yonet" : "ana"; var p2 = document.getElementById("eslPerde"); if (p2) p2.innerHTML = ""; pencereCiz(true); }
    else if (a === "kodGir") {
      var kod = girisKodu(); if (!/^\d{6}$/.test(kod)) return;
      var ai = document.getElementById("eslAdGir");
      var mi = document.querySelector('input[name="eslMod"]:checked');
      var mod = mi ? mi.value : "birlestir";
      if (mod === "devral" && !confirm("Bu bilgisayardaki " + veri.musteriler.length + " müşteri ve bütün satış/ödeme kayıtları silinip diğer bilgisayardaki defter getirilecek.\n\nEmin misin?")) return;
      kodGir(kod, mod, ai ? ai.value : "");
    }
    else if (a === "onayla") istegiOnayla();
    else if (a === "reddet") istegiReddet();
    else if (a === "yonet") { if (esleme && esleme.asama === "tamam") esleme = null; pencereGorunum = M && M.grup ? "yonet" : "ana"; pencereCiz(true); }
    else if (a === "simdiEsitle") {
      if (anaDurum !== "acik") { agKapat(); anaDeneme = 0; agBaslat(); bildir("Yeniden bağlanılıyor…"); return; }
      herkeseBaglan();
      var n = 0; Object.keys(baglar).forEach(function (c) { if (baglar[c].dogru) { ozetGonder(baglar[c]); n++; } });
      bildir(n ? "Eşitleniyor…" : "Bağlı bilgisayar yok. Diğer bilgisayarda program açık mı?");
    }
    else if (a === "ayril") {
      if (!confirm("Bu bilgisayarın eşleşmesi kaldırılsın mı?\n\nKayıtlar bu bilgisayarda kalır ama artık diğer bilgisayarla eşitlenmez.")) return;
      gruptanAyril();
    }
    else if (a === "cikar") {
      var c = t.dataset.c, u = M.grup && M.grup.uyeler[c];
      if (!u || !confirm("“" + u.ad + "” eşleşmeden çıkarılsın mı?\n\nO bilgisayardaki kayıtlar silinmez, sadece artık eşitlenmez.")) return;
      uyeCikar(c);
    }
    else if (a === "adDuzenle") { window.__eslAdDuzen = !window.__eslAdDuzen; pencereCiz(true); }
    else if (a === "adKaydet") { var y = document.getElementById("eslAdYeni"); window.__eslAdDuzen = false; if (y) adDegistir(y.value); pencereCiz(true); }
  });
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (!t || !t.dataset || t.dataset.eslHane === undefined) return;
    var v = String(t.value || "").replace(/\D/g, "");
    var p = document.getElementById("eslPerde");
    var kutular = p ? p.querySelectorAll(".esl-giris input") : [];
    var i = +t.dataset.eslHane;
    if (v.length > 1) { // yapıştırma
      for (var j = 0; j < v.length && i + j < 6; j++) kutular[i + j].value = v[j];
      var son = Math.min(5, i + v.length); kutular[son].focus();
    } else {
      t.value = v;
      if (v && i < 5) kutular[i + 1].focus();
    }
    girisDenetle();
  });
  document.addEventListener("keydown", function (ev) {
    var t = ev.target;
    if (pencereAcik && ev.key === "Escape") { pencereKapat(); return; }
    if (t && t.dataset && t.dataset.eslHane !== undefined) {
      var i = +t.dataset.eslHane, p = document.getElementById("eslPerde");
      var kutular = p ? p.querySelectorAll(".esl-giris input") : [];
      if (ev.key === "Backspace" && !t.value && i > 0) { kutular[i - 1].value = ""; kutular[i - 1].focus(); ev.preventDefault(); }
      else if (ev.key === "ArrowLeft" && i > 0) kutular[i - 1].focus();
      else if (ev.key === "ArrowRight" && i < 5) kutular[i + 1].focus();
      else if (ev.key === "Enter") { var bt = document.getElementById("eslGirBtn"); if (bt && !bt.disabled) bt.click(); }
    } else if (t && t.id === "eslAdYeni" && ev.key === "Enter") { var k = document.querySelector('[data-esl="adKaydet"]'); if (k) k.click(); }
  });
  document.addEventListener("paste", function (ev) {
    var t = ev.target;
    if (!t || !t.dataset || t.dataset.eslHane === undefined) return;
    var v = ((ev.clipboardData && ev.clipboardData.getData("text")) || "").replace(/\D/g, "").slice(0, 6);
    if (v.length < 2) return;
    ev.preventDefault();
    var p = document.getElementById("eslPerde"), kutular = p.querySelectorAll(".esl-giris input");
    for (var j = 0; j < 6; j++) kutular[j].value = v[j] || "";
    kutular[Math.min(5, v.length)].focus();
    girisDenetle();
  });

  /* ---------------- zamanlayıcılar ---------------- */
  function nabiz() {
    var t = simdi();
    Object.keys(baglar).forEach(function (c) {
      var b = baglar[c];
      if (!b.dogru) return;
      if (t - b.son > 20000) { bagKapat(b); return; }
      if (t - (b.ping || 0) >= 5000) { b.ping = t; gonder(b, { t: "p" }); }
    });
    herkeseBaglan();
    var su = document.getElementById("eslSure");
    if (su) su.textContent = sureYazi();
    if (esleme && esleme.rol === "ev" && esleme.asama === "bekliyor" && esleme.bitis && t > esleme.bitis) {
      esleme.asama = "hata"; esleme.hata = "Kodun süresi doldu. Yeni kod oluştur.";
      try { esleme.peer.destroy(); } catch (er) {}
      arayuz();
    }
    if (bekleyenCiz && !duzenleniyor()) ekranTazele();
  }

  /* ---------------- dışa açılan ---------------- */
  window.Esitleme = {
    baslat: function () {
      metaHazirla();
      if (!nabizZamanlayici) {
        nabizZamanlayici = setInterval(nabiz, 1000);
        var sayacN = 0;
        setInterval(function () { sayacN++; herkeseBaglan(); if (sayacN % 3 === 0) arayuz(); }, 8000);
      }
      if (M.grup) agBaslat();
      arayuz();
    },
    yerelKayit: yerelKayit,
    ayarKutusu: ayarKutusu,
    ac: function () { pencereAc(M && M.grup ? "yonet" : "ana"); },
    _durum: function () { return { M: M, anaDurum: anaDurum, baglar: baglar, esleme: esleme, sayac: sayac }; }
  };
})();

<script>
/* ============================================================
   MacarZeka (web sürümü) — kayıtları bilgisayarda bir klasöre yazma
   ------------------------------------------------------------
   * Bir kere klasör seçilir (ör. Belgeler\MacarZeka Kayıtlar).
   * Her değişiklikte o klasördeki veriler.json güncellenir.
   * Her gün yedekler\veriler-YYYY-AA-GG.json kopyası alınır (son 60 gün).
   * Tarayıcı hafızası yine ikinci kopya olarak tutulur; açılışta hangisi
     daha yeniyse o kullanılır. Edge verisi silinse bile klasör yerinde kalır.
   * Yalnızca Edge/Chrome'da (File System Access) çalışır; Windows
     programında (MASAUSTU) devre dışıdır, o zaten klasöre yazar.
   ============================================================ */
(function () {
  "use strict";
  var DB = "macarzeka-klasor", DEPO = "tutamak", ANAHTAR_T = "klasor";
  var DOSYA = "veriler.json", YEDEK_DIZIN = "yedekler", YEDEK_SAYI = 60;

  var dizin = null;          // FileSystemDirectoryHandle
  var durum = "yok";         // yok | izin | acik | hata | desteksiz
  var hata = "", sonYazma = "", bekleyen = false, zamanlayici = null;
  var zincir = Promise.resolve(), yedekGunu = "";

  function destekli() { return typeof window.showDirectoryPicker === "function" && !(typeof MASAUSTU !== "undefined" && MASAUSTU); }
  function e(s) { return typeof esc === "function" ? esc(s) : String(s == null ? "" : s); }
  function ik(ad) { return '<svg class="ik" aria-hidden="true"><use href="#' + ad + '"/></svg>'; }
  function bildir(m) { if (typeof toast === "function") toast(m); }
  function simdiSaat() { var d = new Date(); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function gun() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function tarihYaz(t) { if (!t) return "bilinmiyor"; var d = new Date(t); return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }

  /* ---------- tutamağı hatırlama (IndexedDB) ---------- */
  function dbAc() {
    return new Promise(function (ok, red) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(DEPO); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { red(r.error); };
    });
  }
  function dbAl() {
    if (window.MZ_KLASOR_DEPO) return window.MZ_KLASOR_DEPO.al();   // test için
    return dbAc().then(function (db) {
      return new Promise(function (ok) {
        var t = db.transaction(DEPO, "readonly").objectStore(DEPO).get(ANAHTAR_T);
        t.onsuccess = function () { ok(t.result || null); }; t.onerror = function () { ok(null); };
      });
    }).catch(function () { return null; });
  }
  function dbKoy(v) {
    if (window.MZ_KLASOR_DEPO) return window.MZ_KLASOR_DEPO.koy(v);
    return dbAc().then(function (db) {
      return new Promise(function (ok) {
        var tx = db.transaction(DEPO, "readwrite");
        if (v) tx.objectStore(DEPO).put(v, ANAHTAR_T); else tx.objectStore(DEPO).delete(ANAHTAR_T);
        tx.oncomplete = function () { ok(true); }; tx.onerror = function () { ok(false); };
      });
    }).catch(function () { return false; });
  }

  /* ---------- dosya okuma / yazma ---------- */
  function izinVar(h, iste) {
    if (!h) return Promise.resolve(false);
    var o = { mode: "readwrite" };
    var q = h.queryPermission ? h.queryPermission(o) : Promise.resolve("granted");
    return q.then(function (s) {
      if (s === "granted") return true;
      if (!iste || !h.requestPermission) return false;
      return h.requestPermission(o).then(function (s2) { return s2 === "granted"; });
    }).catch(function () { return false; });
  }
  function dosyaOku(h) {
    return h.getFileHandle(DOSYA).then(function (f) { return f.getFile(); })
      .then(function (f) { return f.text(); })
      .then(function (t) {
        var v = JSON.parse(t);
        if (!v || !Array.isArray(v.musteriler) || !Array.isArray(v.satislar) || !Array.isArray(v.odemeler)) throw new Error("tanınmayan dosya");
        return v;
      })
      .catch(function (er) { if (er && er.name === "NotFoundError") return null; throw er; });
  }
  function dosyaYaz(h, ad, metin) {
    return h.getFileHandle(ad, { create: true }).then(function (f) { return f.createWritable(); })
      .then(function (w) { return w.write(metin).then(function () { return w.close(); }); });
  }
  function gunlukYedek(metin) {
    var g = gun();
    if (yedekGunu === g) return Promise.resolve();
    return dizin.getDirectoryHandle(YEDEK_DIZIN, { create: true }).then(function (y) {
      var ad = "veriler-" + g + ".json";
      return y.getFileHandle(ad).then(function () { yedekGunu = g; }, function () {
        return dosyaYaz(y, ad, metin).then(function () { yedekGunu = g; return eskiYedekleriSil(y); });
      });
    }).catch(function () {});
  }
  function eskiYedekleriSil(y) {
    if (!y.keys) return Promise.resolve();
    var adlar = [];
    var it = y.keys();
    function dolas() {
      return it.next().then(function (r) {
        if (r.done) return;
        if (/^veriler-\d{4}-\d{2}-\d{2}\.json$/.test(r.value)) adlar.push(r.value);
        return dolas();
      });
    }
    return dolas().then(function () {
      adlar.sort();
      var sil = adlar.slice(0, Math.max(0, adlar.length - YEDEK_SAYI));
      return Promise.all(sil.map(function (a) { return y.removeEntry(a).catch(function () {}); }));
    }).catch(function () {});
  }

  // Asıl yazma: sırayla, üst üste binmeden
  function simdiYaz() {
    if (!dizin || durum !== "acik") { bekleyen = true; return Promise.resolve(); }
    bekleyen = false;
    zincir = zincir.then(function () {
      var metin = JSON.stringify(veri);
      return dosyaYaz(dizin, DOSYA, metin).then(function () {
        sonYazma = simdiSaat(); hata = "";
        return gunlukYedek(metin);
      });
    }).catch(function (er) {
      var ilk = durum !== "hata";
      if (er && (er.name === "NotAllowedError" || er.name === "SecurityError")) { durum = "izin"; hata = ""; }
      else { durum = "hata"; hata = (er && er.message) || "yazılamadı"; }
      bekleyen = true;
      if (ilk) bildir(durum === "izin" ? "Kayıt klasörüne erişim izni gerekiyor — sol alttan izin ver." : "DİKKAT: Klasöre yazılamadı — " + hata);
    }).then(function () { if (typeof durumYaz === "function") durumYaz(); arayuz(); });
    return zincir;
  }
  function yaz() {
    if (!destekli()) return;
    if (durum !== "acik") { bekleyen = true; return; }
    clearTimeout(zamanlayici);
    zamanlayici = setTimeout(simdiYaz, 250);
  }
  // Kayıt zamanı (kz): hangi kopya daha yeni anlaşılsın. kaydet() tarayıcıya yazmadan önce çağırır.
  function damgala() { if (destekli() && veri) veri.kz = Date.now(); }

  /* ---------- açılış ---------- */
  function hafizayaKoyVeYenile(v) {
    try { localStorage.setItem(typeof ANAHTAR !== "undefined" ? ANAHTAR : "macarzeka_veri_v1", JSON.stringify(v)); } catch (er) {}
    location.reload();
  }
  // Klasördeki kopya ile tarayıcıdakini karşılaştırır. true: sayfa yenilenecek
  function karsilastir(dosya, acilista) {
    var yerelKz = (veri && veri.kz) || 0, yerelBos = !veri || !veri.musteriler || veri.musteriler.length === 0;
    if (!dosya) { simdiYaz(); return false; }
    if ((dosya.kz || 0) > yerelKz || (yerelBos && dosya.musteriler.length)) {
      if (acilista) {
        var lis = veri && veri.lisans;
        veri = dosya; if (lis && !veri.lisans) veri.lisans = lis;
        if (typeof hafizayaYaz === "function") hafizayaYaz();
        return false;
      }
      hafizayaKoyVeYenile(dosya); return true;
    }
    if (yerelKz > (dosya.kz || 0)) simdiYaz();
    return false;
  }

  function baslat() {
    if (!destekli()) { durum = "desteksiz"; return Promise.resolve(); }
    return dbAl().then(function (h) {
      if (!h) { durum = "yok"; setTimeout(function () { soruGoster(); }, 900); return; }
      dizin = h;
      return izinVar(h, false).then(function (var_) {
        if (!var_) { durum = "izin"; setTimeout(function () { izinGoster(); }, 600); return; }
        durum = "acik";
        return dosyaOku(h).then(function (d) { karsilastir(d, true); })
          .catch(function (er) { durum = "hata"; hata = "veriler.json okunamadı: " + ((er && er.message) || ""); });
      });
    }).catch(function () {}).then(function () { arayuz(); });
  }

  /* ---------- kullanıcı işlemleri ---------- */
  function izinVer() {
    if (!dizin) return klasorSec();
    return izinVar(dizin, true).then(function (ok) {
      if (!ok) { bildir("İzin verilmedi. Kayıtlar şimdilik yalnızca tarayıcıda tutuluyor."); arayuz(); return; }
      durum = "acik"; hata = ""; pencereKapat();
      return dosyaOku(dizin).then(function (d) {
        if (karsilastir(d, false)) return;
        if (bekleyen) simdiYaz();
        bildir("Kayıt klasörü bağlandı: " + dizin.name);
      }).catch(function (er) { durum = "hata"; hata = "veriler.json okunamadı: " + ((er && er.message) || ""); });
    }).then(function () { if (typeof durumYaz === "function") durumYaz(); arayuz(); });
  }

  function klasorSec() {
    if (!destekli()) return Promise.resolve();
    var h;
    return window.showDirectoryPicker({ id: "macarzeka-kayit", mode: "readwrite", startIn: "documents" }).then(function (x) {
      h = x;
      return izinVar(h, true);
    }).then(function (ok) {
      if (!ok) { bildir("Klasöre yazma izni verilmedi."); return; }
      return dosyaOku(h).catch(function () { return "bozuk"; }).then(function (d) {
        var yerelVar = veri && veri.musteriler && veri.musteriler.length > 0;
        if (d === "bozuk") {
          if (!confirm("Seçtiğin klasördeki veriler.json okunamadı.\n\nÜstüne bu bilgisayardaki kayıtlar yazılsın mı? (Eski dosya yedekler klasörüne taşınmaz, silinir.)")) return;
          d = null;
        }
        if (d && d.musteriler.length && yerelVar && JSON.stringify(d.musteriler) !== JSON.stringify(veri.musteriler)) {
          return secimGoster(h, d);
        }
        return baglan(h, d && !yerelVar ? d : null);

  var SVG_KLASOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></svg>';
  function ust(b, a) {

      '<div class="esl-alt"><button class="btn btn2" data-kls="sonra">Sonra</button><button class="btn" data-kls="sec">' + ik("i-klasor") + 'Klasör seç</button></div>');

  /* ---------- görünüm ---------- */
  function durumHTML() {

        '<button class="btn" style="width:100%;margin-bottom:9px" data-kls="izin">' + ik("i-onay") + 'İzin ver</button>';
    }
    return '<div style="font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:14px">Kayıtlar şu an yalnızca tarayıcıda duruyor. Bir klasör seç; her değişiklik bilgisayardaki dosyaya da yazılsın.</div>' +
      '<button class="btn" style="width:100%;margin-bottom:9px" data-kls="sec">' + ik("i-klasor") + 'Kayıt klasörü seç</button>';
  }
  function arayuz() {
    if (typeof durumYaz === "function") durumYaz();
    var k = document.getElementById("klsAyar");

  }

  window.KlasorKayit = {
    destekli: destekli, baslat: baslat, yaz: yaz, damgala: damgala,
    durumHTML: durumHTML, ayarHTML: ayarHTML, sec: klasorSec,
    _durum: function () { return { durum: durum, dizin: dizin, hata: hata, sonYazma: sonYazma, bekleyen: bekleyen }; },
    _bekle: function () { clearTimeout(zamanlayici); return simdiYaz(); }
  };
})();

<script>
/* ============================================================
   Şifre kilidi (MacarZeka ve Macar Talimat ortak)
   ------------------------------------------------------------
   * Ayarlar'dan şifre konur. Program her açılışta şifre ister.
   * Belirli süre dokunulmazsa kendiliğinden kilitlenir.
   * Şifre düz yazı saklanmaz: PBKDF2-SHA256 (150.000 tur, tuzlu) özeti tutulur.
   * Yanlış denemelerde artan bekleme süresi vardır.
   * "Şifremi unuttum": cihaza özel kısa kod gösterilir; yönetim panelinden
     (ya da programı kuran kişiden) alınan açma koduyla şifre sıfırlanır.

(function () {
  "use strict";

  function destekli() { return !!(window.crypto && crypto.subtle && window.TextEncoder); }

  function ik(ad) { return '<svg class="ik" aria-hidden="true"><use href="#i-' + ad + '"/></svg>'; }
  function hex(b) { var a = new Uint8Array(b), s = ""; for (var i = 0; i < a.length; i++) s += (a[i] < 16 ? "0" : "") + a[i].toString(16); return s; }

  function rast(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return hex(a); }
  function ayar() { var k = A && A.oku(); return k && k.h && k.s ? k : null; }

  function ozet(sifre, tuz, tur) {

  /* ---------- kilit ekranı ---------- */
  function perde() {
    var p = document.getElementById("kltPerde");
    if (!p) {
      p = document.createElement("div"); p.id = "kltPerde"; p.className = "klt-perde";
      p.setAttribute("role", "dialog"); p.setAttribute("aria-modal", "true"); p.setAttribute("aria-label", "Şifre");
      document.body.appendChild(p);
    }
    return p;
  }
  function arkayiKapat(v) {
    Array.prototype.forEach.call(document.body.children, function (c) {
      if (c.id === "kltPerde" || c.tagName === "SCRIPT") return;
      if (v) { c.setAttribute("data-klt-inert", "1"); c.inert = true; }
      else if (c.getAttribute("data-klt-inert")) { c.removeAttribute("data-klt-inert"); c.inert = false; }
    });
  }
  function kilitle() {
    var k = ayar(); if (!k) return;

    try { document.querySelectorAll("dialog[open]").forEach(function (d) { d.close(); }); } catch (er) {}

  function ac() {

    if (p) { p.classList.add("cikis"); setTimeout(function () { if (!kilitli && p.parentNode) p.remove(); }, 220); }

  }

        '<p class="klt-alt">Aşağıdaki kodu programı kuran kişiye gönderin. Size bir <b>açma kodu</b> verecek.</p>' +

        '</form>' +
        '<div class="klt-hata" id="kltHata">' + (kalan ? 'Çok fazla yanlış deneme. <b id="kltSayac">' + kalan + '</b> saniye bekleyin.' : (hata ? e(hata) : '')) + '</div>' +
        '<button class="klt-link" data-klt="unuttum">Şifremi unuttum</button>';

    var g = p.querySelector("#kltSifre:not([disabled]), #kltAcma");
    if (g) setTimeout(function () { g.focus(); }, 40);
    if (hata) { var kart = p.querySelector(".klt-kart"); kart.classList.remove("salla"); void kart.offsetWidth; kart.classList.add("salla"); }
  }
  function cihazKodu() { var k = ayar(); return (A.uyg || "MZ") + "-" + (k ? k.no : "000"); }

  function sifreDene() {

      if (ok) { ac(); return; }

      kaydetDeneme();
      ciz(hatali >= 5 ? "" : "Yanlış " + (ayar().tur === "pin" ? "PIN" : "şifre") + "." + (hatali >= 3 ? " (" + (5 - hatali) + " deneme sonra bekleme başlar)" : ""));

  /* ---------- ayarlar penceresi ---------- */
  var SURELER = [[0, "Hiç (sadece açılışta sorsun)"], [5, "5 dakika"], [10, "10 dakika"], [30, "30 dakika"], [60, "1 saat"]];

        '<label class="klt-etiket">Yeni ' + 'şifre / PIN</label><input id="kltYeni1" class="klt-girdi" type="password" autocomplete="new-password">' +
        '<label class="klt-etiket">Tekrar</label><input id="kltYeni2" class="klt-girdi" type="password" autocomplete="new-password">' +
        sureSec(k ? k.sure : 10) +
        '<div class="klt-not">' + ik("bilgi") + '<span>Unutursanız şifre ekranındaki <b>Şifremi unuttum</b> ile açma kodu alınır. Kayıtlar silinmez.</span></div>' +
        '<div class="klt-hata" id="kltPHata"></div>' +
        '<div class="klt-alt-btn"><button class="btn-klt ikinci" data-klt="kapat">Vazgeç</button><button class="btn-klt" data-klt="kaydet" data-tip="' + tip + '">Kaydet</button></div>';
    } else if (tip === "kaldir") {

        '<label class="klt-etiket">Şu anki şifre</label><input id="kltEski" class="klt-girdi" type="password" autocomplete="current-password">' +
        '<div class="klt-hata" id="kltPHata"></div>' +
        '<div class="klt-alt-btn"><button class="btn-klt ikinci" data-klt="kapat">Vazgeç</button><button class="btn-klt tehlike" data-klt="kaldirOnay">Şifreyi kaldır</button></div>';
