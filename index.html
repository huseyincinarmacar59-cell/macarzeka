    var p = document.getElementById("kltPencere");
    if (!p) { p = document.createElement("div"); p.id = "kltPencere"; p.className = "klt-pencere-perde"; document.body.appendChild(p); }
    p.innerHTML = '<div class="klt-pencere"><button class="klt-kapat" data-klt="kapat" aria-label="Kapat">' + ik("carpi") + '</button>' + h + '</div>';
    var ilk = p.querySelector("input[type=password]"); if (ilk) setTimeout(function () { ilk.focus(); }, 40);
  }
  function pencereKapat() { var p = document.getElementById("kltPencere"); if (p) p.remove(); }
  function pHata(m) { var x = document.getElementById("kltPHata"); if (x) x.textContent = m; }

  function kaydetSifre(tip) {
    var tur = (document.querySelector('input[name="kltTur"]:checked') || {}).value || "pin";
    var a = document.getElementById("kltYeni1").value, b = document.getElementById("kltYeni2").value;
    var sure = +document.getElementById("kltSure").value;
    if (tur === "pin" && !/^\d{4,8}$/.test(a)) { pHata("PIN 4-8 rakamdan oluşmalı."); return; }
    if (tur === "sifre" && a.length < 4) { pHata("Şifre en az 4 karakter olsun."); return; }
    if (a !== b) { pHata("İki yazdığınız aynı değil."); return; }
    var once = tip === "degistir" ? dogrula(document.getElementById("kltEski").value) : Promise.resolve(true);
    once.then(function (ok) {
      if (!ok) { pHata("Şu anki şifre yanlış."); return; }
      var eski = ayar(), tuz = rast(16);
      return ozet(a, tuz, TUR).then(function (h) {
        var no = eski && eski.no ? eski.no : String(100 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900));
        A.yaz({ tur: tur, s: tuz, h: h, t: TUR, sure: sure, no: no });
        pencereKapat(); ayarYenile();
        bildir(tip === "koy" ? "Şifre konuldu. Program açılışta şifre soracak." : "Şifre değiştirildi.");
      });
    });
  }
  function kaldir() {
    dogrula(document.getElementById("kltEski").value).then(function (ok) {
      if (!ok) { pHata("Şifre yanlış."); return; }
      A.yaz(null); pencereKapat(); ayarYenile(); bildir("Şifre kaldırıldı.");
    });
  }
  function sureDegis(v) { var k = ayar(); if (!k) return; k.sure = +v; A.yaz(k); ayarYenile(); bildir("Kaydedildi."); }

  /* ---------- ayarlar kartı ---------- */
  function ayarHTML() {
    if (!destekli()) return '<p class="klt-aciklama">Bu tarayıcı şifre özelliğini desteklemiyor.</p>';
    var k = ayar();
    if (!k) return '<p class="klt-aciklama">Program şifresiz açılıyor. Şifre koyarsanız her açılışta ve uzun süre dokunulmayınca şifre sorar.</p>' +
      '<div class="klt-satir"><button class="' + (A.btnAna || "btn") + '" data-klt="koy">' + ik("kilit") + 'Şifre koy</button></div>';
    var s = SURELER.filter(function (x) { return x[0] === k.sure; })[0];
    return '<p class="klt-aciklama"><b>' + ik("onay") + (k.tur === "pin" ? "PIN" : "Şifre") + ' açık.</b> Açılışta soruyor' + (k.sure ? ', ' + (s ? s[1] : k.sure + ' dakika') + ' dokunulmazsa kilitleniyor.' : '.') + '</p>' +
      '<label class="klt-etiket">Dokunulmazsa kilitlensin</label><select class="klt-girdi" data-klt-sure="1" style="margin-bottom:12px">' +
        SURELER.map(function (x) { return '<option value="' + x[0] + '"' + (x[0] === k.sure ? ' selected' : '') + '>' + x[1] + '</option>'; }).join("") + '</select>' +
      '<div class="klt-satir">' +
        '<button class="' + (A.btnAna || "btn") + '" data-klt="simdi">' + ik("kilit") + 'Şimdi kilitle</button>' +
        '<button class="' + (A.btnIkinci || "btn btn2") + '" data-klt="degistir">Şifreyi değiştir</button>' +
        '<button class="' + (A.btnTehlike || "btn btn2 btn-dan") + '" data-klt="kaldir">Kaldır</button>' +
      '</div>';
  }
  function ayarYenile() {
    var x = document.getElementById("kltAyar"); if (x) x.innerHTML = ayarHTML();
    var b = document.getElementById("kltHizli"); if (b) b.hidden = !ayar();
  }

  /* ---------- olaylar ---------- */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest ? ev.target.closest("[data-klt]") : null;
    if (!t) return;
    var a = t.dataset.klt;
    if (a === "unuttum") { gorunum = "unuttum"; ciz(); }
    else if (a === "geri") { gorunum = "giris"; ciz(); }
    else if (a === "acmaKodu") acmaKoduDene();
    else if (a === "koy") pencereAc("koy");
    else if (a === "degistir") pencereAc("degistir");
    else if (a === "kaldir") pencereAc("kaldir");
    else if (a === "kapat") pencereKapat();
    else if (a === "kaydet") kaydetSifre(t.dataset.tip);
    else if (a === "kaldirOnay") kaldir();
    else if (a === "simdi") kilitle();
  });
  document.addEventListener("submit", function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.kltForm) { ev.preventDefault(); sifreDene(); }
  });
  document.addEventListener("change", function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.kltSure) sureDegis(ev.target.value);
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target && ev.target.id === "kltAcma") { ev.preventDefault(); acmaKoduDene(); }
    if (ev.key === "Enter" && ev.target && /^kltYeni2$|^kltEski$/.test(ev.target.id)) {
      var b = document.querySelector('[data-klt="kaydet"],[data-klt="kaldirOnay"]'); if (b) { ev.preventDefault(); b.click(); }
    }
    if (ev.key === "Escape" && document.getElementById("kltPencere")) pencereKapat();
  });
  ["mousemove", "mousedown", "keydown", "touchstart", "wheel", "scroll"].forEach(function (o) {
    window.addEventListener(o, function () { if (!kilitli) sonHareket = Date.now(); }, { passive: true, capture: true });
  });
  setInterval(function () {
    if (kilitli) {
      var s = document.getElementById("kltSayac");
      if (s) { var k = kalanBekleme(); if (k > 0) s.textContent = k; else ciz(); }
      return;
    }
    var a = ayar();
    if (a && a.sure > 0 && Date.now() - sonHareket > a.sure * 60000) kilitle();
  }, 1000);

  window.Kilit = {
    kur: function (o) { A = o; },
    baslat: function () { if (!destekli() || !A) return; ayarYenile(); if (ayar()) kilitle(); },
    kilitliMi: function () { return kilitli; },
    kilitle: kilitle,
    ayarHTML: function () { return A ? ayarHTML() : ""; },
    ayarYenile: ayarYenile,
    destekli: destekli
  };
})();
</script>
<!-- KILIT-BITIS -->
<script>
"use strict";
/* ============================================================
   MacarZeka — müşteri / satış / ödeme / bağlantı takibi
   Masaüstünde veriler.json'a otomatik kaydeder.
   ============================================================ */

var SURUM = "1.0";
var ANAHTAR = "macarzeka_veri_v1";
var MASAUSTU = !!(window.macar && window.macar.oku);

var veri = { surum:1, musteriler:[], satislar:[], odemeler:[] };
var gorunum = { ad:"panel", musteriId:null, filtre:"hepsi", arama:"", koy:"", mod:"yeni", soru:"", cevap:null, yerel:null,
  sesIsliyor:null, sesHata:"", sesForm:null, sesMetin:"",
  guncelleme:null, guncellemeHata:"", guncellemeBakHata:"", guncellemeKuruluyor:false, guncellemeDepo:"" };
var ayar = { acik:false, model:"", sesModel:"", anahtarVar:false, anahtarMaske:"", mikrofonId:"", mikrofonAd:"" };
var bilgi = { dosya:"", klasor:"" };
var sonKayit = null, kayitHata = null, yazmaBekle = null, kirli = false;

/* ---------- yardımcılar ---------- */
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function norm(s){
  s = String(s==null?"":s).toLocaleLowerCase("tr");
  var h={"ı":"i","İ":"i","ş":"s","ğ":"g","ü":"u","ö":"o","ç":"c","â":"a","î":"i","û":"u"};
  return s.replace(/[ıİşğüöçâîû]/g,function(c){return h[c]||c;}).replace(/\s+/g," ").trim();
}
function para(n){
  n = Number(n)||0;
  return n.toLocaleString("tr-TR",{minimumFractionDigits:0,maximumFractionDigits:2})+" ₺";
}
function bugun(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function trTarih(iso){
  if(!iso) return "—";
  var p=String(iso).slice(0,10).split("-");
  if(p.length!==3) return iso;
  return p[2]+"."+p[1]+"."+p[0];
}
function gunFark(iso){
  if(!iso) return null;
  var a=new Date(iso+"T00:00:00"), b=new Date(bugun()+"T00:00:00");
  if(isNaN(a)) return null;
  return Math.round((b-a)/86400000);
}
function saat(){
  var d=new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function bashar(ad){
  var p=String(ad||"").trim().split(/\s+/);
  return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toLocaleUpperCase("tr");
}
function el(h){ var d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstChild; }
function toast(msg){
  var t=document.querySelector(".toast"); if(t) t.remove();
  var d=el('<div class="toast">'+esc(msg)+'</div>');
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.remove(); },3200);
}

/* ---------- hesaplar ---------- */
function msAl(mid){ return veri.musteriler.filter(function(m){return m.id===mid;})[0]||null; }
function satislari(mid){ return veri.satislar.filter(function(s){return s.musteriId===mid;}).sort(function(a,b){return (b.tarih||"").localeCompare(a.tarih||"");}); }
function odemeleri(mid){ return veri.odemeler.filter(function(o){return o.musteriId===mid;}).sort(function(a,b){return (b.tarih||"").localeCompare(a.tarih||"");}); }
function toplamAlis(mid){ var t=0; veri.satislar.forEach(function(s){ if(s.musteriId===mid) t+=Number(s.tutar)||0; }); return t; }
function toplamOdeme(mid){ var t=0; veri.odemeler.forEach(function(o){ if(o.musteriId===mid) t+=Number(o.tutar)||0; }); return t; }
function borc(mid){ return Math.max(0, toplamAlis(mid)-toplamOdeme(mid)); }
function enYakinVade(mid){
  var v=null;
  satislari(mid).forEach(function(s){ if(s.vade && (!v || s.vade<v)) v=s.vade; });
  return v;
}
function durum(mid){
  var b=borc(mid);
  if(b<=0) return {tip:"ok",yazi:"Temiz"};
  var v=enYakinVade(mid), f=v?gunFark(v):null;
  if(f!==null && f>0) return {tip:"borc",yazi:f+" gün gecikti"};
  if(v) return {tip:"vade",yazi:trTarih(v)+" vadeli"};
  return {tip:"borc",yazi:"Borç var"};
}
function bagliOlanlar(mid){
  var liste=[], m=msAl(mid);
  if(m && m.hesapSahibiId){
    var h=msAl(m.hesapSahibiId);
    if(h) liste.push({m:h, aciklama:"Hesap bunun üstüne yazılı"+(m.iliski?" ("+m.iliski+")":"")});
  }
  veri.musteriler.forEach(function(x){
    if(x.hesapSahibiId===mid) liste.push({m:x, aciklama:"Hesabı bunun üstünde"+(x.iliski?" ("+x.iliski+")":"")});
  });
  return liste;
}
function borclular(){
  return veri.musteriler.filter(function(m){ return borc(m.id)>0; })
    .sort(function(a,b){
      var va=enYakinVade(a.id), vb=enYakinVade(b.id);
      var fa=va?gunFark(va):-9999, fb=vb?gunFark(vb):-9999;
      if(fb!==fa) return fb-fa;
      return borc(b.id)-borc(a.id);
    });
}
function ayBasi(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
}

/* ---------- kayıt ---------- */
function durumYaz(){
  var d=document.getElementById("durum");
  if(!d) return;
  if(MASAUSTU){
    if(kayitHata) d.innerHTML='<b style="color:var(--red)"><svg class="ik" aria-hidden="true"><use href="#i-uyari"/></svg>KAYDEDİLEMEDİ</b><br>'+esc(kayitHata)+'<br>Yedek al ve bana haber ver.';
    else if(sonKayit) d.innerHTML='<svg class="ik" aria-hidden="true"><use href="#i-onay"/></svg>Kaydedildi <b style="color:var(--ink)">'+esc(sonKayit)+'</b><br><span style="font-size:11px">'+esc(bilgi.dosya||"")+'</span>';
    else d.innerHTML='Veriler şuraya kaydediliyor:<br><span style="font-size:11px;color:#fff">'+esc(bilgi.dosya||"veriler.json")+'</span>';
  } else {
    var kh = window.KlasorKayit && KlasorKayit.destekli() ? KlasorKayit.durumHTML() : null;
    d.innerHTML = kh || '<svg class="ik" aria-hidden="true"><use href="#i-onay"/></svg>Otomatik kaydediliyor';
  }
}
function hafizayaYaz(){ try{ localStorage.setItem(ANAHTAR, JSON.stringify(veri)); }catch(e){} }
function hafizadanOku(){
  try{
    var s=localStorage.getItem(ANAHTAR);
    if(s){ var v=JSON.parse(s); if(v&&v.musteriler) veri=v; }
  }catch(e){}
}
function kaydet(){
  if(window.Esitleme) Esitleme.yerelKayit();   // eşleşik bilgisayarlara değişikliği gönder
  if(!MASAUSTU){
    if(window.KlasorKayit) KlasorKayit.damgala();
    hafizayaYaz(); kirli=true;
    if(window.KlasorKayit) KlasorKayit.yaz();   // seçilen klasördeki veriler.json'a da yaz
    durumYaz(); return;
  }
  if(yazmaBekle) clearTimeout(yazmaBekle);
  yazmaBekle=setTimeout(function(){
    window.macar.yaz(veri).then(function(r){
      if(r && r.ok){ sonKayit=saat(); kayitHata=null; }
      else { kayitHata=(r&&r.hata)||"bilinmeyen hata"; toast("DİKKAT: Kayıt yazılamadı — "+kayitHata); }
      durumYaz();
    }).catch(function(e){
      kayitHata=e.message; durumYaz(); toast("DİKKAT: Kayıt yazılamadı — "+e.message);
    });
  },150);
}
function yedekAl(){
  if(MASAUSTU){
    window.macar.yedekAl(veri).then(function(r){
      if(r && r.ok) toast("Yedek kaydedildi: "+r.yol);
      else if(r && !r.iptal) toast("Yedek alınamadı: "+(r.hata||""));
    });
    return;
  }
  var ad="macarzeka-yedek-"+bugun()+".json";
  var b=new Blob([JSON.stringify(veri,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=ad;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  kirli=false;
  toast("Yedek indirildi: "+ad);
}
function yedekYukleBaslat(){
  if(MASAUSTU){
    window.macar.yedekYukle().then(function(r){
      if(!r || r.iptal) return;
      if(!r.ok){ toast("Okunamadı: "+(r.hata||"")); return; }
      if(!confirm("Şu anki bütün kayıtlar silinip yedektekiler yüklenecek.\n\nYedekteki müşteri sayısı: "+r.veri.musteriler.length+"\nŞu anki müşteri sayısı: "+veri.musteriler.length+"\n\nDevam edilsin mi?")) return;
      var lis=veri.lisans, kl=veri.kilit; veri=r.veri; if(lis) veri.lisans=lis; if(kl) veri.kilit=kl; else delete veri.kilit; kaydet(); ciz(); toast("Yedek yüklendi");
    });
  } else {
    document.getElementById("dosyaSec").click();
  }
}
function dosyadanYukle(dosya){
  var r=new FileReader();
  r.onload=function(){
    try{
      var v=JSON.parse(r.result);
      if(!v || !v.musteriler) throw new Error("Tanınmayan dosya");
      if(!confirm("Şu anki bütün kayıtlar silinip yedektekiler yüklenecek.\n\nDevam edilsin mi?")) return;
      var lis=veri.lisans, kl=veri.kilit; veri=v; if(lis) veri.lisans=lis; if(kl) veri.kilit=kl; else delete veri.kilit; kaydet(); ciz(); toast("Yedek yüklendi: "+v.musteriler.length+" müşteri");
    }catch(e){ toast("Dosya okunamadı: "+e.message); }
  };
  r.readAsText(dosya);
}

/* ---------- SORU SOR ---------- */
function musteriBul(s){
  var tcler=String(s).match(/\b[1-9][0-9]{10}\b/g);
  if(tcler){ for(var q=0;q<tcler.length;q++){ var bt=tcSahibi(tcler[q],null); if(bt) return bt; } }
  var n=norm(s), bulunan=null, enUzun=0;
  veri.musteriler.forEach(function(m){
    var a=norm(m.ad);
    if(a && n.indexOf(a)>=0 && a.length>enUzun){ bulunan=m; enUzun=a.length; }
  });
  if(bulunan) return bulunan;
  veri.musteriler.forEach(function(m){
    norm(m.ad).split(" ").forEach(function(p){
      if(p.length>2 && n.indexOf(p)>=0 && p.length>enUzun){ bulunan=m; enUzun=p.length; }
    });
  });
  return bulunan;
}
function kisiOzeti(m){
  var ta=toplamAlis(m.id), to=toplamOdeme(m.id), b=borc(m.id), v=enYakinVade(m.id);
  var c = "<b>"+esc(m.ad)+"</b>'ın toplam "+para(ta)+" alışı var, "+para(to)+" ödedi. ";
  if(b<=0) c += "<b style='color:var(--green)'>Borcu yok.</b> ";
  else{
    c += "<b style='color:var(--red)'>"+para(b)+" borcu kaldı.</b> ";
    if(v){
      var f=gunFark(v);
      c += (f!==null && f>0) ? ("Vadesi "+trTarih(v)+"'de doldu, <b>"+f+" gün gecikti</b>. ") : ("Vadesi "+trTarih(v)+". ");
    }
  }
  if(m.hesapSahibiId){ var h=msAl(m.hesapSahibiId); if(h) c += "Hesap kendi adına değil, <b>"+esc(h.ad)+"</b>'ın üstüne yazılı. "; }
  var ustunde = veri.musteriler.filter(function(x){return x.hesapSahibiId===m.id;});
  if(ustunde.length) c += "Ayrıca "+ustunde.map(function(x){return "<b>"+esc(x.ad)+"</b>";}).join(", ")+" bunun hesabından alıyor. ";
  return c;
}
/* Defterin tamamını Gemini'ye gönderilecek düz metne çevirir. */
/* ---------- TC Kimlik No ---------- */
function tcTemizle(v){ return String(v==null?"":v).replace(/\D/g,""); }
// Resmî algoritma: 11 hane, ilk hane 0 değil, 10. ve 11. haneler denetim hanesi.
function tcGecerli(v){
  var t=tcTemizle(v);
  if(!/^[1-9][0-9]{10}$/.test(t)) return false;
  var d=t.split("").map(Number);
  var tek=d[0]+d[2]+d[4]+d[6]+d[8], cift=d[1]+d[3]+d[5]+d[7];
  if(((tek*7-cift)%10+10)%10!==d[9]) return false;
  var top=0; for(var i=0;i<10;i++) top+=d[i];
  return top%10===d[10];
}
function tcSahibi(t, haric){
  t=tcTemizle(t); if(!t) return null;
  return veri.musteriler.filter(function(m){ return m.id!==haric && tcTemizle(m.tc)===t; })[0]||null;
}
function tcDurumHTML(v){
  var t=tcTemizle(v);
  if(!t) return "";
  if(t.length<11) return '<span style="color:var(--muted)">'+t.length+'/11 hane</span>';
  return tcGecerli(t) ? '<span style="color:var(--green);font-weight:600"><svg class="ik" aria-hidden="true"><use href="#i-tik"/></svg>Geçerli TC</span>'
                      : '<span style="color:var(--red);font-weight:600"><svg class="ik" aria-hidden="true"><use href="#i-carpi"/></svg>Hatalı TC — rakamları kontrol et</span>';
}

/* Not: TC Kimlik No Gemini'ye giden deftere bilerek KONMAZ. */
function baglamKur(){
  var s=[];
  s.push("BUGÜNÜN TARİHİ: "+trTarih(bugun()));
  s.push("TOPLAM MÜŞTERİ: "+veri.musteriler.length);
  var genelBorc=0; veri.musteriler.forEach(function(m){ genelBorc+=borc(m.id); });
  s.push("TOPLAM KALAN ALACAK: "+para(genelBorc));
  s.push("");
  veri.musteriler.forEach(function(m,i){
    var b=borc(m.id), d=durum(m.id);
    var bas=[ "### "+(i+1)+". MÜŞTERİ: "+m.ad ];
    var kimlik=[];
    if(m.koy) kimlik.push("Köy: "+m.koy);
    if(m.tel) kimlik.push("Telefon: "+m.tel);
    if(m.arazi) kimlik.push("Arazi/ürün: "+m.arazi);
    if(kimlik.length) bas.push(kimlik.join(" | "));
    if(m.hesapSahibiId){
      var h=msAl(m.hesapSahibiId);
      if(h) bas.push("Hesabı KENDİ ADINA DEĞİL, "+h.ad+" adına yazılı"+(m.iliski?" ("+m.iliski+")":"")+".");
    }
    var ustunde=veri.musteriler.filter(function(x){return x.hesapSahibiId===m.id;});
    if(ustunde.length) bas.push("Bu kişinin hesabından alanlar: "+ustunde.map(function(x){return x.ad+(x.iliski?" ("+x.iliski+")":"");}).join(", "));
    bas.push("Toplam alış: "+para(toplamAlis(m.id))+" | Ödediği: "+para(toplamOdeme(m.id))+" | KALAN BORÇ: "+para(b)+" | Durum: "+d.yazi);

    var sl=satislari(m.id);
    if(sl.length){
      bas.push("Aldıkları:");
      sl.forEach(function(x){
        bas.push("  - "+x.urun+(x.miktar?" ("+x.miktar+")":"")+", "+trTarih(x.tarih)+", "+para(x.tutar)+
          (x.vade?", vade: "+trTarih(x.vade):"")+(x.vadeNot?", vade notu: "+x.vadeNot:""));
      });
    } else bas.push("Aldıkları: kayıt yok");

    var ol=odemeleri(m.id);
    if(ol.length){
      bas.push("Ödemeleri:");
      ol.forEach(function(x){
        bas.push("  - "+trTarih(x.tarih)+", "+para(x.tutar)+", "+(x.yontem||"yöntem belirtilmemiş")+(x.not?", not: "+x.not:""));
      });
    } else bas.push("Ödemeleri: kayıt yok");

    if((m.notlar||[]).length){
      bas.push("Notlar:");
      m.notlar.forEach(function(n){ bas.push("  - "+trTarih(n.tarih)+": "+n.metin); });
    }
    s.push(bas.join("\n"));
    s.push("");
  });
  return s.join("\n");
}

function cevapla(soru){
  var s=norm(soru);
  if(!s) return null;
  var m=musteriBul(soru), kaynaklar=[], rakamlar=null, metin="";

  /* Sorunun ne sorduğunu anlarken müşterinin adını cümleden çıkarıyoruz.
     Yoksa "Çağlayanoğlu" gibi bir soyadındaki "oğlu" ya da "Satılmış"
     gibi bir addaki kelime soruyu yanlış yöne çekiyor. */
  var sk = s;
  if(m){
    sk = sk.split(norm(m.ad)).join(" ");
    norm(m.ad).split(" ").forEach(function(p){ if(p.length>2) sk = sk.split(p).join(" "); });
    sk = sk.replace(/\s+/g," ").trim();
  }

  var sorBorc = /borc|odedi|odeme|kalan|alacak|tahsil|veresiye/.test(sk);
  var sorAlis = /ne ald|aldik|alis|satin|urun|gubre|ilac|tohum/.test(sk);
  var sorBag  = /hesab|hesap|bagl|kimin ust|kiminle|akraba|kardes|babas|(^|\s)oglu|ortag/.test(sk);
  var sorListe= /kimler|kim var|liste|hepsi|tum|herkes|borclu/.test(sk);
  var sorAy   = /bu ay|aylik|toplam|ne kadar sat|ciro/.test(sk);
  var sorNot  = /(^|\s)not(lar|u|um)?(\s|$)|ne dedi|ne soyled|konusma|gorusme/.test(sk);

  if(m){
    if(sorAlis && !sorBorc){
      var sl=satislari(m.id);
      if(!sl.length) metin = "<b>"+esc(m.ad)+"</b> adına kayıtlı alış yok.";
      else{
        metin = "<b>"+esc(m.ad)+"</b> şunları aldı:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
          sl.map(function(x){ return "<li>"+esc(x.urun)+(x.miktar?" ("+esc(x.miktar)+")":"")+" — "+para(x.tutar)+", "+trTarih(x.tarih)+"</li>"; }).join("")+"</ul>";
        sl.slice(0,6).forEach(function(x){ kaynaklar.push({t:"Satış · "+trTarih(x.tarih), mid:m.id}); });
      }
    } else if(sorBag && !sorBorc){
      var bg=bagliOlanlar(m.id);
      if(!bg.length) metin = "<b>"+esc(m.ad)+"</b> için kayıtlı bağlantı yok, kendi hesabından alıyor.";
      else metin = "<b>"+esc(m.ad)+"</b> şunlarla bağlantılı:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
        bg.map(function(x){ return "<li><b>"+esc(x.m.ad)+"</b> — "+esc(x.aciklama)+"</li>"; }).join("")+"</ul>";
    } else if(sorNot && !sorBorc && (m.notlar||[]).length){
      metin = "<b>"+esc(m.ad)+"</b> için tutulan notlar:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
        m.notlar.slice().reverse().map(function(n){ return "<li>"+esc(n.metin)+" <span style='color:var(--muted)'>("+trTarih(n.tarih)+")</span></li>"; }).join("")+"</ul>";
      m.notlar.slice(0,4).forEach(function(n){ kaynaklar.push({t:"Not · "+trTarih(n.tarih), mid:m.id}); });
    } else {
      metin = kisiOzeti(m);
      rakamlar = {a:toplamAlis(m.id), o:toplamOdeme(m.id), b:borc(m.id)};
      satislari(m.id).slice(0,3).forEach(function(x){ kaynaklar.push({t:"Satış · "+trTarih(x.tarih), mid:m.id}); });
      odemeleri(m.id).slice(0,3).forEach(function(x){ kaynaklar.push({t:"Ödeme · "+trTarih(x.tarih), mid:m.id}); });
      (m.notlar||[]).slice(0,2).forEach(function(x){ kaynaklar.push({t:"Not · "+trTarih(x.tarih), mid:m.id}); });
    }
    return {metin:metin, rakamlar:rakamlar, kaynaklar:kaynaklar, musteriId:m.id};
  }

  if(sorBorc || sorListe){
    var bl=borclular();
    if(!bl.length) metin = "Borcu olan kimse yok, bütün hesaplar temiz.";
    else{
      var t=0; bl.forEach(function(x){ t+=borc(x.id); });
      metin = "Şu an <b>"+bl.length+" kişinin</b> toplam <b style='color:var(--red)'>"+para(t)+"</b> borcu var:<ul style='margin:10px 0 0;padding-left:20px;line-height:1.7'>"+
        bl.slice(0,20).map(function(x){
          var d=durum(x.id);
          return "<li><b>"+esc(x.ad)+"</b> — "+para(borc(x.id))+" <span style='color:var(--muted)'>("+esc(d.yazi)+")</span></li>";
        }).join("")+"</ul>";
      bl.slice(0,6).forEach(function(x){ kaynaklar.push({t:x.ad, mid:x.id}); });
    }
    return {metin:metin, rakamlar:null, kaynaklar:kaynaklar, musteriId:null};
  }

  if(sorAy){
    var bas=ayBasi(), sat=0, od=0;
    veri.satislar.forEach(function(x){ if((x.tarih||"")>=bas) sat+=Number(x.tutar)||0; });
    veri.odemeler.forEach(function(x){ if((x.tarih||"")>=bas) od+=Number(x.tutar)||0; });
    metin = "Bu ay toplam <b>"+para(sat)+"</b> satış yapıldı, <b style='color:var(--green)'>"+para(od)+"</b> tahsil edildi.";
    rakamlar = {a:sat, o:od, b:Math.max(0,sat-od)};
    return {metin:metin, rakamlar:rakamlar, kaynaklar:[], musteriId:null};
  }

  return {metin:"Bunu anlayamadım. Bir isim yazarsan o kişinin her şeyini söylerim; aşağıdaki hazır sorulara da tıklayabilirsin.", rakamlar:null, kaynaklar:[], musteriId:null};
}

/* ============================================================
   SES — mikrofon, canlı seviye, kayıt
   Ses hiçbir zaman diske yazılmaz; yalnızca bellekte tutulup gönderilir.
   ============================================================ */
var ses = {
  akis:null, kaydedici:null, parcalar:[], tip:"",
  ctx:null, analiz:null, tampon:null, olcer:null,
  baslangic:0, sayac:null, aktif:false, amac:null, hedef:null,
  mikrofonlar:[], izinVar:false, seviyeAcik:false, enYuksek:0, sonSeviye:0,
  olcumSayisi:0, iptal:false
};
var ENCOK_SANIYE = 180;

function sesDestekli(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function sesHazirMi(){
  return sesDestekli() && !!window.zeka && ayar.anahtarVar;
}
function sesNedenKapali(){
  if(!sesDestekli()) return "Bu pencere mikrofonu desteklemiyor.";
  if(!window.zeka) return "Sesli kayıt bu pencerede kullanılamıyor.";
  if(!ayar.anahtarVar) return "Sesli kayıt için Ayarlar'dan Gemini anahtarı girilmeli.";
  return "";
}

/* ---- mikrofon listesi ---- */
function mikrofonlariGetir(izinIste){
  if(!sesDestekli()) return Promise.resolve([]);
  var once = izinIste && !ses.izinVar
    ? navigator.mediaDevices.getUserMedia({audio:true}).then(function(a){
        ses.izinVar=true;
        a.getTracks().forEach(function(t){ t.stop(); });
      })
    : Promise.resolve();
  return once.then(function(){
    return navigator.mediaDevices.enumerateDevices();
  }).then(function(liste){
    var m=[];
    liste.forEach(function(d){
      if(d.kind==="audioinput"){
        m.push({ id:d.deviceId, ad:d.label || ("Mikrofon "+(m.length+1)) });
      }
    });
    ses.mikrofonlar=m;
    if(m.length && m[0].ad && m[0].ad.indexOf("Mikrofon ")!==0) ses.izinVar=true;
    return m;
  }).catch(function(e){
    ses.mikrofonlar=[];
    throw e;
  });
}

/* Kayıtlı mikrofonu bulur: önce id, olmazsa ada göre (fiş değişince id değişir). */
function seciliMikrofon(){
  var m=ses.mikrofonlar;
  if(!m.length) return null;
  var i;
  if(ayar.mikrofonId){
    for(i=0;i<m.length;i++) if(m[i].id===ayar.mikrofonId) return m[i];
  }
  if(ayar.mikrofonAd){
    for(i=0;i<m.length;i++) if(m[i].ad===ayar.mikrofonAd) return m[i];
  }
  return null;
}
function akisKisitlari(){
  var ayarlar = { echoCancellation:true, noiseSuppression:true, autoGainControl:true };
  var sec=seciliMikrofon();
  if(sec && sec.id) ayarlar.deviceId={ exact: sec.id };
  return { audio: ayarlar };
}

/* ---- canlı seviye ölçümü ---- */
function olcumBaslat(akis){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ses.ctx = new AC();
    // Tarayıcı ses motorunu askıya alabilir; ölçüm yapabilmek için uyandır.
    if(ses.ctx.state === "suspended" && ses.ctx.resume) { try{ ses.ctx.resume(); }catch(e){} }
    var kaynak = ses.ctx.createMediaStreamSource(akis);
    ses.analiz = ses.ctx.createAnalyser();
    ses.analiz.fftSize = 1024;
    ses.analiz.smoothingTimeConstant = 0.6;
    kaynak.connect(ses.analiz);
    ses.tampon = new Uint8Array(ses.analiz.fftSize);
    ses.enYuksek = 0; ses.olcumSayisi = 0;
    // Zamanlayıcı kullanıyoruz: pencere küçültülse veya arkada kalsa da ölçüm sürer.
    ses.olcer = setInterval(olcumDon, 60);
    olcumDon();
  }catch(e){ /* seviye gösterilemezse kayıt yine çalışır */ }
}
function olcumDon(){
  if(!ses.analiz){ return; }
  ses.analiz.getByteTimeDomainData(ses.tampon);
  var top=0, i, v;
  for(i=0;i<ses.tampon.length;i++){ v=(ses.tampon[i]-128)/128; top+=v*v; }
  var rms=Math.sqrt(top/ses.tampon.length);
  var yuzde=Math.min(100, Math.round(rms*260));
  ses.sonSeviye=yuzde;
  ses.olcumSayisi++;
  if(yuzde>ses.enYuksek) ses.enYuksek=yuzde;
  seviyeCiz(yuzde);
}
function seviyeCiz(yuzde){
  var kutular=document.querySelectorAll(".seviye i");
  if(kutular.length){
    var dolu=Math.round((yuzde/100)*kutular.length);
    for(var i=0;i<kutular.length;i++){
      var acik=i<dolu;
      kutular[i].style.height = acik ? (7+Math.round((i+1)/kutular.length*25))+"px" : "6px";
      kutular[i].className = acik ? (i>=kutular.length-3 ? "yuksek" : "on") : "";
    }
  }
  var d=document.querySelectorAll(".dalga i");
  if(d.length){
    for(var k=0;k<d.length;k++){
      var oran=Math.max(0.12, (yuzde/100)*(0.55+0.45*Math.sin((Date.now()/120)+k*0.7)));
      d[k].style.height=Math.max(4, Math.round(oran*30))+"px";
      d[k].style.background = yuzde>6 ? "var(--green)" : "var(--green-line)";
    }
  }
  var y=document.getElementById("seviyeYazi");
  if(y){
    y.textContent = yuzde<4 ? "Ses gelmiyor" : (yuzde<12 ? "Çok kısık" : (yuzde>88 ? "Çok yüksek" : "İyi"));
    y.style.color = (yuzde<4||yuzde>88) ? "var(--red)" : (yuzde<12 ? "var(--warn)" : "var(--green)");
  }
}
function olcumDurdur(){
  if(ses.olcer){ clearInterval(ses.olcer); ses.olcer=null; }
  ses.analiz=null; ses.tampon=null;
  if(ses.ctx){ try{ ses.ctx.close(); }catch(e){} ses.ctx=null; }
  seviyeCiz(0);
}

/* ---- sadece seviye göstergesi (Ayarlar'daki mikrofon denemesi) ---- */
function seviyeAc(){
  if(ses.aktif) return Promise.resolve(false);
  seviyeKapat();
  return navigator.mediaDevices.getUserMedia(akisKisitlari()).then(function(a){
    ses.izinVar=true; ses.akis=a; ses.seviyeAcik=true;
    olcumBaslat(a);
    return true;
  });
}
function seviyeKapat(){
  if(ses.aktif) return;
  olcumDurdur();
  if(ses.akis){ ses.akis.getTracks().forEach(function(t){ t.stop(); }); ses.akis=null; }
  ses.seviyeAcik=false;
}

/* ---- kayıt ---- */
function sesTipiSec(){
  var adaylar=["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/ogg","audio/mp4"];
  for(var i=0;i<adaylar.length;i++){
    try{ if(window.MediaRecorder.isTypeSupported(adaylar[i])) return adaylar[i]; }catch(e){}
  }
  return "";
}

function kayitBaslat(amac, hedef){
  if(ses.aktif) return Promise.resolve(false);
  var neden=sesNedenKapali();
  if(neden){ toast(neden); return Promise.resolve(false); }

  seviyeKapat();
  ses.amac=amac; ses.hedef=hedef||null; ses.iptal=false;

  return navigator.mediaDevices.getUserMedia(akisKisitlari()).then(function(a){
    ses.izinVar=true; ses.akis=a; ses.parcalar=[];
    ses.tip=sesTipiSec();
    var sec = ses.tip ? { mimeType: ses.tip, audioBitsPerSecond: 32000 } : {};
    try{ ses.kaydedici=new MediaRecorder(a, sec); }
    catch(e){ ses.kaydedici=new MediaRecorder(a); }
    if(!ses.tip && ses.kaydedici.mimeType) ses.tip=ses.kaydedici.mimeType;

    ses.kaydedici.ondataavailable=function(ev){ if(ev.data && ev.data.size) ses.parcalar.push(ev.data); };
    ses.kaydedici.onerror=function(){ toast("Kayıt sırasında hata oldu, tekrar dene."); kayitIptal(); };
    ses.kaydedici.onstop=function(){ kayitBitti(); };

    ses.kaydedici.start(250);
    ses.aktif=true; ses.baslangic=Date.now();
    olcumBaslat(a);

    ses.sayac=setInterval(function(){
      var gecen=Math.floor((Date.now()-ses.baslangic)/1000);
      var e=document.getElementById("sesSure");
      if(e) e.textContent=Math.floor(gecen/60)+":"+String(gecen%60).padStart(2,"0");
      if(gecen>=ENCOK_SANIYE){ toast("3 dakika doldu, kayıt durduruldu."); kayitDurdur(); }
    },250);

    ciz();
    return true;
  }).catch(function(e){
    ses.aktif=false;
    toast(izinHatasi(e));
    ciz();
    return false;
  });
}
function izinHatasi(e){
  var ad=(e && e.name)||"";
  if(ad==="NotAllowedError"||ad==="SecurityError")
    return "Mikrofon izni verilmedi. Pencerenin üstünde çıkan kutudan 'İzin ver' de.";
  if(ad==="NotFoundError"||ad==="OverconstrainedError")
    return "Seçili mikrofon bulunamadı. Ayarlar'dan başka bir mikrofon seç.";
  if(ad==="NotReadableError")
    return "Mikrofona ulaşılamıyor; başka bir program kullanıyor olabilir.";
  return "Mikrofon açılamadı: "+((e&&e.message)||ad||"bilinmeyen hata");
}
function kayitDurdur(){
  if(!ses.aktif || !ses.kaydedici) return;
  try{ ses.kaydedici.stop(); }catch(e){ kayitBitti(); }
}
function kayitIptal(){
  ses.iptal=true;
  if(ses.aktif && ses.kaydedici){ try{ ses.kaydedici.stop(); }catch(e){} }
  else sesKapat();
  ciz();
}
function sesKapat(){
  if(ses.sayac){ clearInterval(ses.sayac); ses.sayac=null; }
  olcumDurdur();
  if(ses.akis){ ses.akis.getTracks().forEach(function(t){ t.stop(); }); ses.akis=null; }
  ses.kaydedici=null; ses.aktif=false; ses.parcalar=[];
}

function kayitBitti(){
  var parcalar=ses.parcalar.slice();
  var tip=ses.tip||"audio/webm";
  var amac=ses.amac, hedef=ses.hedef, iptal=ses.iptal;
  // Ölçüm hiç yapılamadıysa sessizlik uyarısı verme (yanlış alarm olur).
  var tepe = ses.olcumSayisi>8 ? ses.enYuksek : -1;
  sesKapat();
  if(iptal){ ciz(); return; }

  if(!parcalar.length){ toast("Ses kaydedilemedi. Mikrofonu Ayarlar'dan dene."); ciz(); return; }
  var blob=new Blob(parcalar,{type:tip});
  if(blob.size<1200){ toast("Kayıt çok kısa. Butona basılı tutup konuş."); ciz(); return; }
  if(tepe>=0 && tepe<4){ toast("Mikrofondan ses gelmemiş görünüyor; yine de gönderiliyor."); }

  sesIsleniyor(amac, true);
  blobB64(blob).then(function(b64){
    return window.zeka.dinle({ ses:b64, tip:tip, amac:(amac==="form"?"form":"metin"), baglam:sesBaglami(amac) });
  }).then(function(r){
    sesIsleniyor(amac, false);
    if(!(r && r.ok)){ sesHatasi((r&&r.hata)||"bilinmeyen hata", amac); return; }
    sesSonucIsle(amac, hedef, r);
  }).catch(function(e){
    sesIsleniyor(amac, false);
    sesHatasi(e.message, amac);
  });
}
function blobB64(blob){
  return new Promise(function(coz, red){
    var o=new FileReader();
    o.onload=function(){
      var s=String(o.result);
      var v=s.indexOf(",");
      coz(v>=0 ? s.slice(v+1) : s);
    };
    o.onerror=function(){ red(new Error("Ses okunamadı")); };
    o.readAsDataURL(blob);
  });
}
function sesBaglami(amac){
  if(amac!=="form") return "";
  var s=["BUGÜNÜN TARİHİ: "+bugun()];
  if(veri.musteriler.length){
    s.push("MEVCUT MÜŞTERİLER (hesap bağlantısı için id eşleştir):");
    veri.musteriler.slice(0,300).forEach(function(m){
      s.push("  id="+m.id+" | "+m.ad+(m.koy?" | "+m.koy:""));
    });
  } else s.push("Kayıtlı müşteri yok.");
  return s.join("\n");
}
function sesIsleniyor(amac, durum){
  gorunum.sesIsliyor = durum ? (amac||true) : null;
  ciz();
}
function sesHatasi(h, amac){
  gorunum.sesHata=h;
  ciz();
  toast("Ses çözümlenemedi");
}

function sesSonucIsle(amac, hedef, r){
  gorunum.sesHata="";
  if(amac==="soru"){
    gorunum.soru=r.metin;
    gorunum.ad="soru";
    ciz();
    var k=document.getElementById("soruKutu");
    if(k) k.value=r.metin;
    sor();
    return;
  }
  if(amac==="not"){
    gorunum.sesMetin=r.metin;
    ciz();
    var t=document.getElementById(hedef||"yeniNot");
    if(t){ t.value=(t.value?t.value.replace(/\s*$/,"")+" ":"")+r.metin; t.focus(); }
    toast("Yazıya çevrildi, kontrol et");
    return;
  }
  if(amac==="form"){
    gorunum.sesForm={ metin:r.metin, veri:r.veri||null, supheli:[] };
    formaYaz(r.veri||{}, r.metin);
    return;
  }
}

/* ---- konuşmadan gelen alanları forma yazar (ASLA kendiliğinden kaydetmez) ---- */
function sayiAyikla(d){
  if(d===null||d===undefined||d==="") return "";
  if(typeof d==="number") return isFinite(d)?String(d):"";
  var s=String(d).replace(/[^\d.,-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",",".");
  var n=parseFloat(s);
  return isFinite(n)?String(n):"";
}
function tarihAyikla(d){
  if(!d) return "";
  var s=String(d).trim();
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : "";
}
function listeIcinde(d, secenekler){
  if(!d) return "";
  var n=norm(d);
  for(var i=0;i<secenekler.length;i++) if(norm(secenekler[i])===n) return secenekler[i];
  return "";
}
function formaYaz(v, metin){
  gorunum.ad="yeni"; gorunum.mod="yeni";
  var supheli=[];
  if(v && Object.prototype.toString.call(v.supheli)==="[object Array]"){
    v.supheli.forEach(function(x){ supheli.push(String(x)); });
  }
  gorunum.sesForm={ metin:metin, supheli:supheli };
  ciz();

  function koy(kimlik, deger){
    var e=document.getElementById(kimlik);
    if(!e || deger===""||deger===null||deger===undefined) return;
    e.value=deger;
    e.dataset.sesle="1";
  }
  koy("f_ad", v.ad||"");
  koy("f_tel", v.tel||"");
  koy("f_koy", v.koy||"");
  koy("f_arazi", v.arazi||"");
  koy("f_urun", v.urun||"");
  koy("f_miktar", v.miktar||"");
  koy("f_tarih", tarihAyikla(v.tarih));
  koy("f_tutar", sayiAyikla(v.tutar));
  koy("f_odenen", sayiAyikla(v.odenen));
  koy("f_yontem", listeIcinde(v.yontem, ["Nakit","Havale / EFT","Kredi kartı","Çek","Senet"]));
  koy("f_odtarih", tarihAyikla(v.odemeTarihi));
  koy("f_vade", tarihAyikla(v.vade));
  koy("f_vadenot", v.vadeNot||"");
  koy("f_iliski", listeIcinde(v.iliski, ["Babası","Oğlu","Kardeşi","Eşi","Ortağı","Kiracısı","Akrabası"]));
  koy("f_not", v.not||"");

  // hesap sahibi: önce id, olmazsa ada göre eşleştir
  var hid="";
  if(v.hesapSahibiId && msAl(String(v.hesapSahibiId))) hid=String(v.hesapSahibiId);
  else if(v.hesapSahibiAd){
    var ad=norm(v.hesapSahibiAd), bul=null;
    veri.musteriler.forEach(function(m){ if(norm(m.ad)===ad) bul=m; });
    if(!bul) veri.musteriler.forEach(function(m){ if(norm(m.ad).indexOf(ad)>=0 && ad.length>3) bul=m; });
    if(bul) hid=bul.id;
  }
  if(hid) koy("f_hesap", hid);
  else if(v.hesapSahibiAd && supheli.indexOf("hesapSahibi")<0) supheli.push("hesapSahibi");

  // tamamı ödendi mi?
  var tutar=parseFloat(sayiAyikla(v.tutar))||0, odenen=parseFloat(sayiAyikla(v.odenen))||0;
  if(tutar>0 && odenen>=tutar){
    var r1=document.querySelector('input[name="oddurum"][value="tam"]');
    if(r1){ r1.checked=true; document.querySelectorAll(".rad").forEach(function(x){ x.classList.toggle("on", x.dataset.od==="tam"); }); }
  }

  // şüpheli alanları işaretle
  var es={ ad:"f_ad", tel:"f_tel", koy:"f_koy", arazi:"f_arazi", urun:"f_urun", miktar:"f_miktar",
    tarih:"f_tarih", tutar:"f_tutar", odenen:"f_odenen", yontem:"f_yontem", odemeTarihi:"f_odtarih",
    vade:"f_vade", vadeNot:"f_vadenot", iliski:"f_iliski", not:"f_not", hesapSahibi:"f_hesap", hesapSahibiAd:"f_hesap" };
  supheli.forEach(function(k){
    var e=document.getElementById(es[k]||"");
    if(e) e.classList.add("supheli");
  });
  gorunum.sesForm.supheli=supheli;

  var ilk=document.getElementById("f_ad");
  if(ilk) ilk.focus();
  toast("Forma yazıldı — kaydetmeden önce kontrol et");
}

function ciz(){

    b.classList.toggle("on", b.dataset.git===a);

function git(ad,mid){

}

document.addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-git],[data-ms],[data-f],[data-mod],[data-sor],[data-ekle],[data-sil-s],[data-sil-o],[data-sil-n],[data-sil-ms],[data-od],[data-kayit],[data-duzenle]"):null;
  if(t){
    if(t.dataset.duzenle){ gorunum.duzenle=t.dataset.duzenle; ciz(); var e=document.getElementById("d_tc"); if(e) e.focus(); return; }
    if(t.dataset.kayit){ kayitBaslat(t.dataset.kayit, t.dataset.kayit==="not"?"yeniNot":null); return; }
    if(t.dataset.git){ git(t.dataset.git); return; }
    if(t.dataset.ms){ git("musteri", t.dataset.ms); return; }
    if(t.dataset.f){ gorunum.filtre=t.dataset.f; ciz(); return; }
    if(t.dataset.mod){ gorunum.mod=t.dataset.mod; ciz(); return; }
    if(t.dataset.sor){ gorunum.ad="soru"; gorunum.soru=t.dataset.sor; gorunum.cevap=cevapla(t.dataset.sor); ciz(); return; }
    if(t.dataset.od){ document.querySelectorAll(".rad").forEach(function(r){ r.classList.toggle("on", r===t); }); return; }
    if(t.dataset.ekle){ gorunum.ad="yeni"; gorunum.mod=(t.dataset.ekle==="odeme"?"odeme":"satis"); ciz(); return; }
    if(t.dataset.silS){ if(confirm("Bu satış kaydı silinsin mi?")){ veri.satislar=veri.satislar.filter(function(x){return x.id!==t.dataset.silS;}); kaydet(); ciz(); } return; }
    if(t.dataset.silO){ if(confirm("Bu ödeme kaydı silinsin mi?")){ veri.odemeler=veri.odemeler.filter(function(x){return x.id!==t.dataset.silO;}); kaydet(); ciz(); } return; }
    if(t.dataset.silN){
      var mn=msAl(gorunum.musteriId);
      if(mn && confirm("Bu not silinsin mi?")){ mn.notlar=(mn.notlar||[]).filter(function(x){return x.id!==t.dataset.silN;}); kaydet(); ciz(); }
      return;
    }
    if(t.dataset.silMs){
      var mid=t.dataset.silMs, mm=msAl(mid);
      if(!mm) return;
      if(!confirm('"'+mm.ad+'" ve bütün satış, ödeme, not kayıtları kalıcı olarak silinecek.\n\nEmin misin?')) return;
      veri.musteriler=veri.musteriler.filter(function(x){return x.id!==mid;});
      veri.satislar=veri.satislar.filter(function(x){return x.musteriId!==mid;});
      veri.odemeler=veri.odemeler.filter(function(x){return x.musteriId!==mid;});
      veri.musteriler.forEach(function(x){ if(x.hesapSahibiId===mid){ x.hesapSahibiId=null; x.iliski=""; } });
      kaydet(); git("musteriler"); toast("Silindi");
      return;
    }
  }
  if(ev.target.id==="sorBtn") sor();
  else if(ev.target.id==="kaydetBtn") formKaydet();
  else if(ev.target.id==="notEkle") notEkle();
  else if(ev.target.id==="ornek") ornekYukle();
  else if(ev.target.id==="ayarKaydetBtn") ayarKaydet(false);
  else if(ev.target.id==="ayarDeneBtn") geminiDene();
  else if(ev.target.id==="ayarAcKapa") ayarAcKapa();
  else if(ev.target.id==="ayarSilBtn") anahtarSil();
  else if(ev.target.id==="ayarKlasor"){ if(MASAUSTU) window.macar.klasorAc(); }
  else if(ev.target.id==="ayarYedek") yedekAl();
  else if(ev.target.id==="ayarAbonelik"){ if(window.Lisans) window.Lisans.ac(); }
  else if(ev.target.id==="ayarYedekYukle") yedekYukleBaslat();
  else if(ev.target.id==="sesDurdur") kayitDurdur();
  else if(ev.target.id==="sesIptal") kayitIptal();
  else if(ev.target.id==="mikYenile") mikrofonYenile();
  else if(ev.target.id==="mikDene") mikrofonDene();
  else if(ev.target.id==="mikDur"){ seviyeKapat(); ciz(); }
  else if(ev.target.id==="duzenleKaydet") duzenleKaydet();
  else if(ev.target.id==="duzenleVazgec"){ gorunum.duzenle=null; ciz(); }
  else if(ev.target.id==="guncKur") guncellemeKur();
  else if(ev.target.id==="guncSonra"){ gorunum.guncelleme=null; ciz(); }
  else if(ev.target.id==="guncKapat"){ gorunum.guncellemeHata=""; ciz(); }
  else if(ev.target.id==="guncBak"){
    ayarSonucYaz('<div class="ozet">GitHub\'a bakılıyor…</div>');
    guncellemeyeBak(true).then(function(b){
      ciz();
      if(b && b.var) ayarSonucYaz('<div class="ozet"><b>Yeni sürüm var: '+esc(b.surum)+'</b><br>Panel ekranındaki şeritten kurabilirsin.</div>');
      else if(b) ayarSonucYaz('<div class="ozet">En son sürümü kullanıyorsun ('+esc(b.buSurum)+').</div>');
      else ayarSonucYaz('<div class="uyari"><b>Bakılamadı.</b><br>'+esc(gorunum.guncellemeBakHata||"")+'</div>');
    });
  }
});

/* Gemini'nin cevabını güvenle ekrana koyar (HTML kaçışlı, basit kalın/madde desteği) */
function metinBicimle(t){
  var e=esc(String(t==null?"":t));
  e=e.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  e=e.replace(/(^|<br>|\n)\s*[\*\-]\s+/g,"$1• ");
  return e.replace(/\n/g,"<br>");
}

function sor(){
  var i=document.getElementById("soruKutu");
  var s=i?String(i.value).trim():"";
  gorunum.soru=s;
  if(!s){ gorunum.cevap=null; ciz(); return; }

  var yerel=cevapla(s);
  gorunum.yerel=yerel;

  if(!(ayar.acik && window.zeka)){
    gorunum.cevap=yerel; ciz(); return;
  }

  gorunum.cevap={ bekliyor:true, metin:"",
    kaynaklar:(yerel&&yerel.kaynaklar)||[], musteriId:(yerel&&yerel.musteriId)||null };
  ciz();

  var istenen=s;
  // TC Kimlik No Google'a gitmesin: soruda geçiyorsa yerine kişinin adını koy.
  var gidecek=String(s).replace(/\b[1-9][0-9]{10}\b/g,function(t){ var k=tcSahibi(t,null); return k?k.ad:"[TC]"; });
  window.zeka.sor({ soru:gidecek, baglam:baglamKur() }).then(function(r){
    if(gorunum.soru!==istenen || gorunum.ad!=="soru") return; // kullanıcı başka şey yaptı
    if(r && r.ok){
      gorunum.cevap={ metin:metinBicimle(r.cevap), gemini:true, model:r.model,
        kaynaklar:(yerel&&yerel.kaynaklar)||[], musteriId:(yerel&&yerel.musteriId)||null,
        rakamlar:(yerel&&yerel.rakamlar)||null };
    } else {
      gorunum.cevap=yerelHataIle(yerel,(r&&r.hata)||"bilinmeyen hata");
    }
    ciz();
  }).catch(function(e){
    if(gorunum.soru!==istenen || gorunum.ad!=="soru") return;
    gorunum.cevap=yerelHataIle(yerel, e.message);
    ciz();
  });
}
function yerelHataIle(yerel, hata){
  var c={ metin:"", kaynaklar:[], musteriId:null, rakamlar:null };
  if(yerel){ c.metin=yerel.metin; c.kaynaklar=yerel.kaynaklar||[]; c.musteriId=yerel.musteriId||null; c.rakamlar=yerel.rakamlar||null; }
  c.uyari=hata;
  return c;
}
function notEkle(){

  if(!ta||!m) return;
  var v=ta.value.trim();

  m.notlar=m.notlar||[];

}

/* TC'yi kaydetmeden önce sor: hatalıysa ya da başkasında kayıtlıysa. */
function tcOnayla(tc, haric){
  if(!tc) return true;
  if(!tcGecerli(tc) && !confirm("TC Kimlik No hatalı görünüyor ("+tc+").\n\nYine de böyle kaydedilsin mi?")) return false;
  var s=tcSahibi(tc, haric);
  if(s && !confirm("Bu TC zaten \""+s.ad+"\" adına kayıtlı.\n\nYine de kaydedilsin mi?")) return false;
  return true;
}
function formKaydet(){
  var mod=gorunum.mod, mid=null;
  if(mod==="yeni"){
    var ad=deger("f_ad");
    if(!ad){ toast("Müşterinin adını yaz"); return; }
    var varOlan=veri.musteriler.filter(function(m){ return norm(m.ad)===norm(ad); })[0];
    if(varOlan && !confirm('"'+ad+'" zaten kayıtlı. Yine de yeni bir kayıt açılsın mı?')) return;
    var tc=tcTemizle(deger("f_tc"));
    if(!tcOnayla(tc, null)) return;
    var m={ id:id(), ad:ad, tel:deger("f_tel"), tc:tc, koy:deger("f_koy"), arazi:deger("f_arazi"),
            hesapSahibiId:deger("f_hesap")||null, iliski:deger("f_iliski"), notlar:[] };
    veri.musteriler.push(m); mid=m.id;
  } else {
    mid=deger("f_ms");
    if(!mid){ toast("Müşteri seç"); return; }
  }

  if(mod!=="odeme"){
    var urun=deger("f_urun"), tutar=Number(deger("f_tutar"))||0;
    if(urun || tutar){
      if(!urun){ toast("Ürün adını yaz"); return; }
      if(!tutar){ toast("Tutarı yaz"); return; }
      veri.satislar.push({ id:id(), musteriId:mid, urun:urun, miktar:deger("f_miktar"),
        tarih:deger("f_tarih")||bugun(), tutar:tutar, vade:deger("f_vade")||"", vadeNot:deger("f_vadenot") });
    }
  }

  var odenen=Number(deger("f_odenen"))||0;
  var r=document.querySelector('input[name="oddurum"]:checked');
  if(r && r.value==="tam" && !odenen) odenen=Number(deger("f_tutar"))||0;
  if(odenen>0){
    veri.odemeler.push({ id:id(), musteriId:mid, tutar:odenen, tarih:deger("f_odtarih")||bugun(),
      yontem:deger("f_yontem")||"Nakit", not:deger("f_odnot") });
  }

  var nt=deger("f_not");
  if(nt){
    var mm=msAl(mid);
    if(mm){ mm.notlar=mm.notlar||[]; mm.notlar.push({id:id(),tarih:bugun(),metin:nt}); }
  }

  kaydet();
  gorunum.musteriId=mid; gorunum.ad="musteri"; ciz();
  toast("Kaydedildi");
}

/* ---------- ayarlar ---------- */
function ayarSonucYaz(h){ var e=document.getElementById("ayarSonuc"); if(e) e.innerHTML=h; }

function ayarlariGetir(){
  if(!window.zeka) return Promise.resolve();
  return window.zeka.ayarlar().then(function(r){ ayarYaz(r); }).catch(function(){});
}
function ayarYaz(r){
  if(!(r && r.ok)) return false;
  ayar.acik=!!r.acik; ayar.model=r.model||""; ayar.sesModel=r.sesModel||"";
  ayar.anahtarVar=!!r.anahtarVar; ayar.anahtarMaske=r.anahtarMaske||"";
  ayar.mikrofonId=r.mikrofonId||""; ayar.mikrofonAd=r.mikrofonAd||"";
  return true;
}

function ayarKaydet(sessiz){
  if(!window.zeka){ toast("Ayarlar kaydedilemedi."); return Promise.resolve(false); }
  var g=document.getElementById("geminiAnahtar");
  var md=document.getElementById("geminiModel");
  var sm=document.getElementById("geminiSesModel");
  var mk=document.getElementById("mikSec");
  var paket={};
  if(g && g.value.trim()) paket.anahtar=g.value.trim();
  if(md && md.value) paket.model=md.value;
  if(sm && sm.value) paket.sesModel=sm.value;
  if(mk){
    paket.mikrofonId=mk.value||"";
    var sec=null;
    ses.mikrofonlar.forEach(function(m){ if(m.id===mk.value) sec=m; });
    paket.mikrofonAd=sec?sec.ad:"";
  }
  return window.zeka.ayarKaydet(paket).then(function(r){
    if(!(r && r.ok)){ ayarSonucYaz('<div class="uyari">Kaydedilemedi: '+esc((r&&r.hata)||"")+'</div>'); return false; }
    ayarYaz(r);

    return true;
  }).catch(function(e){ ayarSonucYaz('<div class="uyari">Kaydedilemedi: '+esc(e.message)+'</div>'); return false; });
}

function ayarAcKapa(){
  if(!window.zeka) return;

    return window.zeka.ayarKaydet({acik:yeni});

    if(ayarYaz(r)){
      ciz();
      ayarSonucYaz(ayar.acik
        ? '<div class="ozet">Gemini açıldı. Soru Sor ekranından dene.</div>'
        : '<div class="ozet">Gemini kapatıldı. Sorular programın kendi aramasıyla cevaplanacak.</div>');

  }).catch(function(e){ ayarSonucYaz('<div class="uyari">İşlem yapılamadı: '+esc(e.message)+'</div>'); });

function geminiDene(){
  if(!window.zeka){ toast("Bağlantı denenemedi."); return; }
  ayarSonucYaz('<div class="ozet">Deneniyor…</div>');
  ayarKaydet(true).then(function(){

      ayarSonucYaz('<div class="uyari"><b>Bağlantı kurulamadı.</b><br>'+esc((r&&r.hata)||"bilinmeyen hata")+'</div>');
    }
  }).catch(function(e){ ayarSonucYaz('<div class="uyari"><b>Bağlantı kurulamadı.</b><br>'+esc(e.message)+'</div>'); });
}

/* ---------- güncelleme ---------- */
function guncellemeyeBak(zorla){
  if(!(MASAUSTU && window.macar.guncellemeBak)) return Promise.resolve(null);
  var oncekiSerit = !!(gorunum.guncelleme && gorunum.guncelleme.var);
  return window.macar.guncellemeBak(zorla).then(function(r){
    if(r && r.ok){
      gorunum.guncelleme=r.bilgi;
      gorunum.guncellemeDepo=r.depo||"";
      gorunum.guncellemeHata="";
      // Şerit durumu değiştiyse ekranı tazele (eski şerit ekranda kalmasın).
      if(oncekiSerit !== !!r.bilgi.var && gorunum.ad==="panel") ciz();
      return r.bilgi;
    }
    gorunum.guncellemeBakHata=(r&&r.hata)||"bilinmeyen hata";
    return null;
  }).catch(function(e){
    gorunum.guncellemeBakHata=e.message;
    return null;
  });
}
function guncellemeKur(){
  if(!(MASAUSTU && window.macar.guncellemeKur)) return;
  if(!confirm("Yeni sürüm indirilip kurulacak.\n\nProgram kendini kapatıp yeniden açacak.\nMüşteri kayıtlarına dokunulmaz; kurulumdan önce ayrıca yedek alınır.\n\nDevam edilsin mi?")) return;
  gorunum.guncellemeKuruluyor=true; gorunum.guncellemeHata=""; ciz();
  window.macar.guncellemeKur().then(function(r){
    if(r && r.ok){
      gorunum.guncellemeKuruluyor=false;
      gorunum.guncelleme=null;
      ciz();
      alert("Sürüm "+r.surum+" kuruldu.\n\nProgram şimdi kapanıp yeni sürümle açılacak.\nBirkaç saniye bekle.");
    } else {
      gorunum.guncellemeKuruluyor=false;
      gorunum.guncellemeHata=(r&&r.hata)||"bilinmeyen hata";
      ciz();
    }
  }).catch(function(e){
    gorunum.guncellemeKuruluyor=false;
    gorunum.guncellemeHata=e.message;
    ciz();
  });
}

/* ---------- abonelik ---------- */
// Abonelik bilgisi müşteri verisinin içinde tutulur: masaüstünde veriler.json'a,
// tarayıcıda tarayıcı hafızasına yazılır (program her açılışta farklı adres kullandığı için).
var abonelikOkumaUyarisi=false;
function abonelikKur(){
  try{
    if(!window.Lisans) return;
    window.Lisans.kur({ depo:{
      oku:function(){ return veri.lisans||null; },
      yaz:function(v){ var a=JSON.stringify(veri.lisans||null), b=JSON.stringify(v); if(a===b) return; veri.lisans=v;
        // veriler.json okunamadıysa (bozuk dosya uyarısı) kendiliğinden üstüne yazma.
        if(MASAUSTU && abonelikOkumaUyarisi) return;
        kaydet(); }
    }});
  }catch(e){}
}

/* ---------- başlat ---------- */
function kilitKur(){
  if(!window.Kilit) return;
  Kilit.kur({ uyg:"MZ", ad:"MacarZeka", logo:"icon-192.png", bildir:toast,
    btnAna:"btn", btnIkinci:"btn btn2", btnTehlike:"btn btn2 btn-dan",
    oku:function(){ return veri.kilit||null; },
    yaz:function(v){ if(v) veri.kilit=v; else delete veri.kilit; kaydet(); } });
  Kilit.baslat();   // şifre varsa kayıtlar görünmeden kilit ekranı gelir
}
function basla(){
  if(MASAUSTU){
    var uyari="";
    window.macar.oku().then(function(r){
      if(r && r.veri) veri=r.veri;
      if(r){ bilgi.dosya=r.dosya||""; bilgi.klasor=r.klasor||""; uyari=r.uyari||""; }
      kilitKur();
      if(window.Esitleme) Esitleme.baslat();
      return ayarlariGetir();
    }).then(function(){
      durumYaz(); ciz(); abonelikOkumaUyarisi=!!uyari; abonelikKur();
      // mikrofon listesini sessizce getir (izin istemeden; etiketler izinden sonra dolar)
      if(sesDestekli()) mikrofonlariGetir(false).then(function(){ if(gorunum.ad==="ayarlar") ciz(); }).catch(function(){});
      // yeni sürüm var mı? (sessiz; yoksa hiçbir şey göstermez)
      setTimeout(function(){ guncellemeyeBak(false).then(function(b){ if(b && b.var) ciz(); }); }, 2500);
      // Program açık kalırsa da yeni sürümü görsün: 15 dakikada bir bak.
      // Şerit yalnızca Panel ekranında çıkar, kayıt girerken rahatsız etmez.
      setInterval(function(){
        if(gorunum.guncelleme && gorunum.guncelleme.var) return;  // zaten biliyoruz
        if(gorunum.guncellemeKuruluyor) return;
        guncellemeyeBak(true).then(function(b){ if(b && b.var && gorunum.ad==="panel") ciz(); });
      }, 15*60*1000);
      if(uyari) setTimeout(function(){ alert("DİKKAT\n\n"+uyari); },400);
    }).catch(function(e){
      durumYaz(); ciz(); alert("Veri okunamadı: "+e.message);
    });
    if(window.macar.bilgi){
      window.macar.bilgi().then(function(b){
        if(b && b.surum){ SURUM=b.surum; var s=document.getElementById("surumYazi"); if(s) s.textContent="Sürüm "+b.surum; }
      }).catch(function(){});
    }
  } else {
    // Tarayıcıda klasör diye bir şey yok; o düğmeyi hiç gösterme.
    var kd=document.getElementById("klasorAc");
    if(kd) kd.style.display="none";
    hafizadanOku();
    // Klasör seçildiyse önce oradaki veriler.json okunur (hangisi yeniyse o kullanılır).
    var klasorHazir = window.KlasorKayit ? KlasorKayit.baslat() : Promise.resolve();
    klasorHazir.catch(function(){}).then(function(){
      kilitKur();
      if(window.Esitleme) Esitleme.baslat(); durumYaz(); ciz(); abonelikKur();
      // Gemini/mikrofon ayarlarını da oku (tarayıcıda saklanıyor), sonra ekranı tazele.
      ayarlariGetir().then(function(){
        ciz();
        if(sesDestekli()) mikrofonlariGetir(false).then(function(){ if(gorunum.ad==="ayarlar") ciz(); }).catch(function(){});
      });
    });
  }
}
basla();
